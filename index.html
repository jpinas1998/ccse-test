/* Guardado en la cuenta (cuando la app se abre como página de claude.ai).
   Un documento privado por persona: data/users/<id>/progreso. Gana la copia más reciente (S.t). */
const Nube = {
  estado: 'local',          // local | conectando | ok | error
  ref: null, escribiendo: false, pendiente: false, timer: null,
  programar() { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.subir(), 1200); },
  async subir() {
    clearTimeout(this.timer); this.timer = null;
    if (!this.ref) return;
    if (this.escribiendo) { this.pendiente = true; return; }
    this.escribiendo = true;
    try { await this.ref.set({ v: 2, t: S.t || Date.now(), estado: JSON.stringify(S) }); this.estado = 'ok'; }
    catch (e) { this.estado = 'error'; }
    this.escribiendo = false;
    if (this.pendiente) { this.pendiente = false; this.subir(); }
  },
  async bajar() {
    if (!this.ref) return;
    let snap;
    try { snap = await Promise.race([this.ref.get(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 10000))]); }
    catch (e) { this.estado = 'error'; render(); return; }
    this.estado = 'ok';
    const d = snap.exists ? snap.data() : null;
    if (d && typeof d.estado === 'string' && (d.t || 0) > (S.t || 0)) {
      try {
        const remoto = migrar(Object.assign(estadoInicial(), JSON.parse(d.estado)));
        if (S.active && S.active.tipo === 'simulacro') pararReloj(S.active);
        S = remoto; aplicarMigracionRondas();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* nada */ }
        if (pantalla === 'sesion' && !S.active) ir('camino', {}, false); else render();
        return;
      } catch (e) { /* copia remota dañada: se sobrescribe con la local */ }
    }
    if (!d || (S.t || 0) > (d.t || 0)) this.subir(); else render();
  },
  async iniciar() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    this.estado = 'conectando';
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = db && user ? await user.id() : null;
      if (!uid) { this.estado = 'local'; render(); return; }
      this.ref = db.doc('data/users/' + uid + '/progreso');
    } catch (e) { this.estado = 'local'; render(); return; }
    await this.bajar();
  },
};

/* Registro de una respuesta. Reglas de dominio:
   - acertar por primera vez -> "acertada"
   - acertar en DOS sesiones distintas -> "dominada" (y deja de ser débil)
   - fallar -> "débil"; si estaba dominada, vuelve a "acertada" */
function registrar(id, ok, sesionId) {
  const r = reg(id);
  r.s++; r.last = Date.now();
  if (ok) {
    r.c++;
    if (r.lcs != null && r.lcs !== sesionId) { r.st = 'dominada'; r.weak = false; }
    else if (r.st === 'nueva' || r.st === 'vista') r.st = 'acertada';
    r.lcs = sesionId;
  } else {
    r.w++; r.weak = true; r.lw = Date.now();
    if (r.st === 'dominada') r.st = 'acertada';
    if (r.st === 'nueva') r.st = 'vista';
  }
  anotarRacha();
}

// ============================================================ El Camino: etapas y rondas
const RONDAS = (() => {
  const out = [];
  for (const t of [1, 2, 3, 4, 5]) {
    // Orden del manual: por número de pregunta (1001, 1002, ...)
    const qs = D.questions.filter(q => q.tarea === t).sort((a, b) => a.id.localeCompare(b.id));
    const n = Math.ceil(qs.length / 10), base = Math.floor(qs.length / n), extra = qs.length % n;
    let i = 0;
    for (let r = 0; r < n; r++) {
      const size = base + (r < extra ? 1 : 0);
      const ids = qs.slice(i, i + size).map(q => q.id); i += size;
      out.push({ key: `${t}-${r + 1}`, tarea: t, num: r + 1, total: n, ids, desde: ids[0], hasta: ids[ids.length - 1], subtemas: [...new Set(ids.map(id => Q[id].subtema))] });
    }
  }
  return out;
})();
const RONDA = Object.fromEntries(RONDAS.map(r => [r.key, r]));
function aplicarMigracionRondas() {

  const ok = id => S.q[id] && (S.q[id].st === 'acertada' || S.q[id].st === 'dominada');
  for (const r of RONDAS) if (r.ids.every(ok)) S.rounds[r.key] = Object.assign({}, viejas[r.key] || {}, { done: true, stars: (viejas[r.key] && viejas[r.key].stars) || 1, size: r.ids.length });
  if (S.active && S.active.tipo === 'ronda') S.active = null;

}

// ============================================================ Simulacros
function candidatasPeso(modo) {
  if (modo === 'refuerzo') return id => { const r = S.q[id]; if (!r) return 2; return r.weak ? 8 + r.w : (r.st === 'dominada' ? 1 : 3); };
  return id => 1 / (1 + (S.q[id] ? S.q[id].ex : 0));
}
function sonHermanas(a, b) { return (Q[a].hermanas || []).includes(b) || (Q[b].hermanas || []).includes(a); }
function elegirTarea(t, k, cands, wfn, rng) {
  const regla = REGLAS[t];
  const distintosDisp = new Set(cands.map(id => Q[id].subtema)).size;
  const minDist = Math.min(regla.min, distintosDisp, k);
  let mejor = null, mejorDist = -1;
  for (let intento = 0; intento < 250; intento++) {
    const elegidas = [], cuenta = {};
    let pool = cands.slice();
    while (elegidas.length < k && pool.length) {
      let eleg = pool.filter(id => (cuenta[Q[id].subtema] || 0) < regla.max && !elegidas.some(e => sonHermanas(e, id)));
      if (!eleg.length) eleg = pool.filter(id => (cuenta[Q[id].subtema] || 0) < regla.max);
      if (!eleg.length) eleg = pool;
      const [id] = weightedPick(eleg, 1, wfn, rng);
      elegidas.push(id); cuenta[Q[id].subtema] = (cuenta[Q[id].subtema] || 0) + 1;
      pool = pool.filter(x => x !== id);
    }
    const dist = Object.keys(cuenta).length;
    if (dist >= minDist) return elegidas;
    if (dist > mejorDist) { mejor = elegidas; mejorDist = dist; }
  }

}
function ordenarPorTarea(ids) { return ids.slice().sort((a, b) => Q[a].tarea - Q[b].tarea); }
// Serie completa: 12 exámenes disjuntos que cubren las 300 preguntas (reparto por subtema).
const SERIE = (() => {
  const rng = mulberry32(2026);
  const examenes = Array.from({ length: 12 }, () => []);
  for (const t of [1, 2, 3, 4, 5]) {
    const orden = ORDEN_SUB[t];
    const porSub = orden.map(s => shuffle(D.questions.filter(q => q.tarea === t && q.subtema === s).map(q => q.id), rng));
    const lista = porSub.flat();
    const offset = Math.floor(rng() * 12);
    lista.forEach((id, i) => examenes[(i + offset) % 12].push(id));
  }
  return examenes.map(ordenarPorTarea);
})();
function generarSimulacro(modo, numSerie) {
  const seed = Math.floor(Math.random() * 1e9);
  const rng = mulberry32(seed);
  let ids = [];
  if (modo === 'serie') ids = SERIE[numSerie - 1].slice();
  else {
    const wfn = candidatasPeso(modo);
    for (const t of [1, 2, 3, 4, 5]) {
      let cands = IDS_T(t);
      if (modo === 'novedades') cands = cands.filter(id => Q[id].nueva2026);
      ids.push(...elegirTarea(t, Math.min(CUPO[t], cands.length), cands, wfn, rng));
    }
  }

  return { ids: ordenarPorTarea(ids), seed, codigo };

/* Una sesión es una cola de preguntas.
   - repetir=true: si fallas, la pregunta vuelve al final de la cola hasta acertarla (rondas y prácticas).

    res: {},          // id -> {primera: bool, intentos}

    else if (ses.tipo === 'simulacro') ses.orden[id] = shuffle(['a', 'b', 'c'], mulberry32(ses.seed ^ hashStr(id)));
    else ses.orden[id] = ['a', 'b', 'c'];

function comprobar() {

  const id = ses.cola[0], q = Q[id];

  else ses.res[id].intentos++;

  ses.ultima = { id, ok, eleccion: ses.sel };

    const ex = $('#explica');

  ses.fase = 'responder'; ses.sel = null; ses.ultima = null;

  const total = ses.ids.length;
  const fallos = ses.ids.filter(id => ses.res[id] && !ses.res[id].primera);
  const resumen = { tipo: ses.tipo, total, primeras, fallos, key: ses.key, titulo: ses.titulo, fecha: Date.now() };
  if (ses.tipo === 'ronda') {
    const estrellas = primeras === total ? 3 : primeras >= Math.ceil(total * 0.8) ? 2 : 1;
    const prev = S.rounds[ses.key];
    S.rounds[ses.key] = { done: true, stars: Math.max(estrellas, prev ? prev.stars : 0), first: primeras, size: total, fecha: Date.now(), veces: (prev ? prev.veces : 0) + 1 };
    resumen.estrellas = estrellas;
    resumen.primeraVez = !prev;
  }
  if (ses.tipo === 'control') {
    if (ses.etapa) S.controles[ses.etapa] = 'hecho';
    resumen.etapa = ses.etapa;
  }
  if (ses.tipo === 'simulacro') {
    pararReloj(ses);
    const porTarea = {};
    for (const t of [1, 2, 3, 4, 5]) { const ids = ses.ids.filter(id => Q[id].tarea === t); porTarea[t] = { ok: ids.filter(id => ses.res[id].primera).length, total: ids.length }; }
    const ex = { codigo: ses.codigo, modo: ses.modo, serie: ses.serie || null, fecha: Date.now(), aciertos: primeras, total, porTarea, ms: ses.ms || 0, fueraTiempo: (ses.ms || 0) > EXAM_MIN * 60000, ids: ses.ids, fallos };
    S.exams.unshift(ex);
    S.exams = S.exams.slice(0, 60);
    if (ses.serie && !S.serieHechos.includes(ses.serie)) S.serieHechos.push(ses.serie);
    Object.assign(resumen, ex);
  }
  S.active = null;
  S.ultimoResumen = resumen;
  guardar();
  ir('resumen');
}
function abandonarSesion() {
  const ses = S.active;
  if (ses && ses.tipo === 'simulacro') pararReloj(ses);
  guardar();
  ir(ses && ses.tipo === 'simulacro' ? 'simulacro' : 'camino');
}
function descartarSesion() { if (S.active && S.active.tipo === 'simulacro') pararReloj(S.active); S.active = null; guardar(); }

// ---------- Reloj del simulacro
let relojTimer = null;
function arrancarReloj(ses) {
  if (ses.tipo !== 'simulacro' || ses.pausa) return;
  ses.t0 = Date.now();
  clearInterval(relojTimer);
  relojTimer = setInterval(() => {
    const el = $('#reloj'); if (!el || !S.active) return;
    const ms = (S.active.ms || 0) + (Date.now() - S.active.t0);
    const quedan = EXAM_MIN * 60000 - ms;
    el.textContent = quedan >= 0 ? fmtTiempo(quedan) : `+${fmtTiempo(-quedan)}`;
    el.classList.toggle('poco', quedan < 5 * 60000);
    if (quedan < 0 && !S.active.avisoTiempo) { S.active.avisoTiempo = true; toast('Se acabaron los 45 minutos. Puedes terminar igualmente.'); }
  }, 1000);
}
function pararReloj(ses) {
  clearInterval(relojTimer); relojTimer = null;
  if (ses && ses.t0) { ses.ms = (ses.ms || 0) + (Date.now() - ses.t0); ses.t0 = null; }
}
document.addEventListener('visibilitychange', () => {
  if (!S.active || S.active.tipo !== 'simulacro') return;
  if (document.hidden) { pararReloj(S.active); guardar(); }
  else if (pantalla === 'sesion') arrancarReloj(S.active);
});

// ---------- Controles sorpresa
function poolEstudiado() { return RONDAS.filter(r => rondaHecha(r.key)).flatMap(r => r.ids); }
function pesoRepaso(id) { const r = S.q[id]; if (!r) return 2; return r.weak ? 6 : (r.st === 'dominada' ? 1 : 3); }
function quizaSorpresa(resumen) {
  // Solo tras completar una ronda por primera vez.
  if (resumen.tipo !== 'ronda' || !resumen.primeraVez) return null;
  const t = RONDA[resumen.key].tarea;
  if (etapaCompleta(t) && !S.controles[t]) {
    return { etapa: t, ids: weightedPick(IDS_T(t), 10, pesoRepaso), titulo: `Control de la etapa ${t}` };
  }
  S.sinceSurprise++;
  const pool = poolEstudiado();
  if (S.sinceSurprise >= 2 && pool.length >= 15 && Math.random() < 0.35) {
    S.sinceSurprise = 0;
    return { etapa: null, ids: weightedPick(pool, 10, pesoRepaso), titulo: 'Examen sorpresa' };
  }
  return null;
}

// ------------------------------------------------------------ Vista: Camino
function contar() {
  let sup = 0, dom = 0, deb = 0;
  for (const q of D.questions) { const r = S.q[q.id]; if (!r) continue; if (r.st === 'acertada' || r.st === 'dominada') sup++; if (r.st === 'dominada') dom++; if (r.weak) deb++; }
  return { sup, dom, deb };
}
function estrellasHTML(n) { return `<span class="estrellas" aria-label="${n} de 3 estrellas">${'★'.repeat(n)}<span class="apagada">${'★'.repeat(3 - n)}</span></span>`; }

  </header>`;

      <div class="etapa-cab"><div><div class="etapa-num">Etapa ${t} de 5</div><h2 class="etapa-nombre" id="et${t}">${esc(TAREAS[t].nombre)}</h2></div>

// ------------------------------------------------------------ Vista: sesión (pregunta + explicación)
function tituloSesion(ses) {
  if (ses.tipo === 'ronda') { const r = RONDA[ses.key]; return `Etapa ${r.tarea}, ronda ${r.num} de ${r.total}`; }
  return ses.titulo || 'Práctica';
}
function vSesion() {
  const ses = S.active;

  const id = ses.cola[0], q = Q[id];
  const orden = ordenOpciones(ses, id);
  const explicar = ses.fase === 'explicar';
  const letrasVis = ['A', 'B', 'C'];
  const respondidas = ses.ids.length - ses.cola.length;
  const vuelve = ses.repetir && ses.res[id] && (ses.fase === 'responder' || ses.res[id].intentos > 1);
  // Progreso: una marca por pregunta de la sesión

    const r = ses.res[x];

    if (ses.repetir && !ses.cola.includes(x)) return `<i class="ok"></i>`;

      <span class="reloj${quedan < 300000 ? ' poco' : ''}" id="reloj" aria-label="Tiempo restante">${quedan >= 0 ? fmtTiempo(quedan) : '+' + fmtTiempo(-quedan)}</span>`;
  }
  cab += `</div><div class="progreso-sesion" aria-hidden="true">${marcas}</div>`;
  if (ses.tipo === 'simulacro' || ses.tipo === 'control') {
    const ok = ses.ids.filter(x => ses.res[x] && ses.res[x].primera).length;
    const ko = ses.ids.filter(x => ses.res[x] && !ses.res[x].primera).length;
    cab += `<div class="marcador"><span>Pregunta <b>${Math.min(respondidas + 1, ses.ids.length)}</b> de ${ses.ids.length}</span><span>Aciertos <b>${ok}</b></span><span>Fallos <b>${ko}</b></span>${ses.tipo === 'simulacro' ? `<span>${ok >= APTO ? '<b>Ya tienes el apto</b>' : `Para el apto: <b>${APTO - ok}</b>`}</span>` : ''}</div>`;
  } else {

  }

function explicacionHTML(q, eleccion, ok, modoLectura = false) {
  const e = q.exp || {};
  let h = `<section class="explica${ok ? '' : ' mal'}" id="explica" tabindex="-1" aria-live="polite">`;
  if (!modoLectura) h += `<div class="explica-tit ${ok ? 'ok' : 'ko'}">${ok ? ICON.ok(28) + ' Correcto' : ICON.ko(28) + ' No es correcto'}</div>`;
  if (!ok && eleccion) {
    h += `<div class="elegiste"><b>Elegiste:</b> ${esc(q.opts[eleccion])}${e.distractores && e.distractores[eleccion] ? `<br>${esc(e.distractores[eleccion])}` : ''}</div>
      <div class="correcta-txt" style="margin-top:8px"><b>Respuesta correcta:</b> ${esc(q.opts[q.ans])}</div>`;
  } else if (modoLectura) {

  if (e.cita && e.cita.tabla) h += `<p class="nota explica-bloque">Lo tienes en la tabla del manual CCSE 2026, página ${esc(e.cita.pag)}.</p>`;
  else if (e.cita && e.cita.texto) h += `<div class="explica-bloque"><blockquote class="cita">«${esc(e.cita.texto)}»<footer>Manual CCSE 2026, página ${esc(e.cita.pag)}</footer></blockquote></div>`;
  if (e.fuera_manual) h += `<p class="nota explica-bloque">Este dato no aparece explicado en el manual. Aquí tienes el contexto, pero la respuesta oficial es la que cuenta.</p>`;
  if (e.sensible_tiempo) h += `<p class="nota explica-bloque">Dato según el manual 2026. Aunque cambie en la realidad, en el examen vale esta respuesta.</p>`;
  if (e.truco) h += `<div class="explica-bloque truco">${ICON.bombilla()}<p><b>Para recordarlo:</b> ${esc(e.truco)}</p></div>`;
  const otras = Object.entries(e.distractores || {}).filter(([L]) => L !== eleccion && L !== q.ans);
  const herm = (q.hermanas || []).filter(x => Q[x]);
  const extra = (ok || modoLectura) ? otras.concat(eleccion && !ok ? [] : []) : otras;
  let mas = '';
  if (extra.length) mas += `<div class="explica-bloque"><h3>${ok ? 'Las otras opciones' : 'La otra opción'}</h3><ul class="otras">${extra.map(([L, t]) => `<li><b>${esc(q.opts[L])}</b> ${esc(t)}</li>`).join('')}</ul></div>`;

  if (mas) h += ok && !modoLectura ? `<details class="mas-info explica-bloque"><summary>Ver más</summary>${mas}</details>` : mas;
  const f = FICHA_SUB[q.subtema];
  const esqs = esquemasDePregunta(q.id).map(r => r.e);
  if (f || esqs.length) h += `<div class="explica-bloque fila-btns">${f ? `<button class="btn btn-sec" data-ficha="${esc(f.id)}">${ICON.lupa()} Repasar: ${esc(f.titulo || q.subtema)}</button>` : ''}${botonesEsquema(esqs, q.id)}</div>`;
  h += `</section>`;
  return h;
}

  if (!e) { params = {}; return vBiblioteca(); }
  let h = `<div class="pagina"><button class="btn-texto" data-bib="">‹ Preguntas y esquemas</button>
    <h1 class="tit-pagina">${esc(e.titulo)}</h1><p class="intro">${esc(e.intro)}</p>`;
  h += esquemaHTML(e, params, false);
  const ids = idsEsquema(e.id);
  const fichas = e.subtemas.map(s => FICHA_SUB[s]).filter(Boolean);
  h += `<div class="tarjeta"><h2>Para repasar</h2>`;
  if (ids.length) h += `<button class="btn btn-ancho" data-practicar-esq="${e.id}" style="margin-bottom:8px">Practicar preguntas de este esquema (${ids.length})</button>`;
  h += `<ul class="lista">${fichas.map(f => `<li><button class="fila" data-ficha="${esc(f.id)}"><span class="crece">Ficha: ${esc(f.titulo || f.subtema)}<br><span class="peq">Tarea ${f.tarea}</span></span>${ICON.chev()}</button></li>`).join('')}</ul></div>`;
  return h + `</div>`;
}

// ------------------------------------------------------------ Vista: progreso y ajustes
function vProgreso() {
  const { sup, dom, deb } = contar();
  const masFalladas = D.questions.filter(q => S.q[q.id] && S.q[q.id].w).sort((a, b) => S.q[b.id].w - S.q[a.id].w).slice(0, 8);
  const ultimos = S.exams.slice(0, 5);
  let h = `<div class="pagina"><h1 class="tit-pagina">Tu progreso</h1>
    <div class="stat-grid"><div class="stat"><b>${sup}</b><span>acertadas de 300</span></div><div class="stat"><b>${dom}</b><span>dominadas</span></div><div class="stat"><b>${deb}</b><span>para repasar</span></div></div>
    <div class="tarjeta" style="margin-top:14px"><h2>Por tarea</h2><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Tarea</th><th class="num">Acertadas</th><th class="num">Dominadas</th></tr></thead><tbody>
    ${[1, 2, 3, 4, 5].map(t => { const ids = IDS_T(t); return `<tr><td>${t}. ${esc(TAREAS[t].corto)}</td><td class="num">${ids.filter(superada).length}/${ids.length}</td><td class="num">${ids.filter(id => est(id) === 'dominada').length}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
  if (ultimos.length) h += `<div class="tarjeta"><h2>Últimos simulacros</h2><p>${ultimos.map(e => `<b style="color:${e.aciertos >= APTO ? 'var(--verde)' : 'var(--rojo)'}">${e.aciertos}</b>`).join(', ')} <span class="nota">(de más reciente a más antiguo; apto con 15)</span></p></div>`;
  if (masFalladas.length) h += `<div class="tarjeta"><h2>Las que más fallas</h2><ul class="lista">${masFalladas.map(q => `<li><button class="fila" data-ver="${q.id}"><span class="punto debil"></span><span class="crece">${esc(q.q)}<br><span class="peq">${plural(S.q[q.id].w, 'fallo', 'fallos')}</span></span>${ICON.chev()}</button></li>`).join('')}</ul></div>`;
  const st = S.settings;
  const seg = (k, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-ajuste="${k}" data-valor="${v}" aria-pressed="${String(st[k]) === String(v)}">${l}</button>`).join('')}</div>`;
  h += `<div class="tarjeta"><h2>Ajustes</h2>
    <div class="campo"><span>Tema</span>${seg('theme', [['auto', 'Auto'], ['light', 'Claro'], ['dark', 'Oscuro']])}</div>
    <div class="campo"><span>Tamaño del texto</span>${seg('fs', [['0.92', 'A−'], ['1', 'A'], ['1.12', 'A+']])}</div>
    <div class="campo"><span>Vibrar al fallar</span>${seg('vibrar', [['true', 'Sí'], ['false', 'No']])}</div></div>
    <div class="tarjeta"><h2>Dónde se guarda</h2><p class="intro" style="margin-bottom:12px">${Nube.estado === 'ok'
      ? 'Tu progreso se guarda en tu cuenta de Claude: lo tienes igual en el móvil y en el ordenador. También puedes hacer una copia en un archivo.'
      : Nube.estado === 'conectando' ? 'Conectando con tu cuenta para guardar el progreso…'
      : Nube.estado === 'error' ? 'Ahora no se puede guardar en tu cuenta (¿sin conexión?). Se guarda en este navegador y se subirá cuando vuelva la conexión.'
      : 'El progreso se guarda en este navegador. Para pasarlo a otro dispositivo o no perderlo, expórtalo y luego impórtalo allí.'}</p>
    <div class="fila-btns"><button class="btn btn-sec" data-accion="exportar">Exportar progreso</button><button class="btn btn-sec" data-accion="importar">Importar progreso</button></div>
    <input type="file" id="archivo-import" accept="application/json,.json" hidden></div>
    <div class="tarjeta"><h2>Sobre esta app</h2><p class="intro">Preguntas, respuestas y citas del <i>Manual de preparación de la prueba CCSE 2026</i> del Instituto Cervantes. Estructura de examen según las especificaciones oficiales. Las explicaciones son material de estudio propio basado en ese manual.</p>
    <button class="btn btn-texto" data-accion="reiniciar" style="color:var(--rojo) !important;padding-left:0">Borrar todo el progreso</button></div></div>`;
  return h;
}

// ============================================================ Modales
function modalAbierto() { return !!$('#modal-root').innerHTML; }
let focoPrevio = null;
function abrirModal(html, etiqueta) {
  focoPrevio = document.activeElement;
  $('#modal-root').innerHTML = `<div class="velo" data-cerrar-velo><div class="dialogo" role="dialog" aria-modal="true" aria-label="${esc(etiqueta)}">${html}</div></div>`;
  const d = $('.dialogo'); const f = d.querySelector('button, [href], input'); if (f) f.focus();
}
function cerrarModal() { if (!modalAbierto()) return; $('#modal-root').innerHTML = ''; if (focoPrevio && document.contains(focoPrevio)) focoPrevio.focus(); }
function modalFicha(fid) {
  const f = FICHAS[fid]; if (!f) return;
  const ids = D.questions.filter(q => q.subtema === f.subtema);
  let h = `<div class="dialogo-cab"><h2>${esc(f.titulo || f.subtema)}</h2><button class="btn-x" data-accion="cerrar" aria-label="Cerrar">${ICON.x()}</button></div>
    <p class="nota" style="margin-bottom:12px">Tarea ${f.tarea}. ${esc(TAREAS[f.tarea].nombre)}${f.pags && f.pags.length ? `. Manual, ${f.pags.length > 1 ? 'páginas' : 'página'} ${f.pags.join(', ')}` : ''}</p>
    <ul class="ficha-puntos">${(f.puntos || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;
  if (f.tabla && f.tabla.filas && f.tabla.filas.length) h += `<div class="tabla-scroll" style="margin-top:14px"><table class="tabla"><thead><tr>${f.tabla.cabecera.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${f.tabla.filas.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if (f.ojo && f.ojo.length) h += `<div class="ojo"><h3>Ojo con</h3><ul>${f.ojo.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>`;
  h += `<p class="nota" style="margin-top:14px">${plural(ids.length, 'pregunta', 'preguntas')} de este tema en el examen.</p>`;
  const esqs = ESQ_SUB(f.subtema).filter(e => ids.some(q => (PREG_ESQ[q.id] || []).some(r => r.e === e.id && r.nodos.length))).map(e => e.id);
  if (esqs.length) h += `<div class="fila-btns" style="margin-top:12px">${botonesEsquema(esqs)}</div>`;
  abrirModal(h, f.titulo || f.subtema);
}
function modalPregunta(id) {
  const q = Q[id]; const r = S.q[id];
  let h = `<div class="dialogo-cab"><h2>${esc(q.q)}</h2><button class="btn-x" data-accion="cerrar" aria-label="Cerrar">${ICON.x()}</button></div>
    <div class="pregunta-meta"><span class="chip">Pregunta ${q.id}</span><span class="chip">${esc(q.subtema)}</span>${q.nueva2026 ? '<span class="chip nueva">Nueva en 2026</span>' : ''}${q.enModelos ? `<span class="chip">Salió en ${plural(q.enModelos, 'modelo oficial', 'modelos oficiales')}</span>` : ''}</div>
    <ul class="otras" style="list-style:none;padding:0">${Object.entries(q.opts).map(([L, t]) => `<li style="padding:6px 0">${L === q.ans ? ICON.ok(18) : '<span style="display:inline-block;width:18px"></span>'} ${q.tipo === 'vf' ? '' : L + ') '}${esc(t)}</li>`).join('')}</ul>
    ${explicacionHTML(q, null, true, true)}
    ${r ? `<p class="nota" style="margin-top:12px">La has respondido ${plural(r.s, 'vez', 'veces')}: ${r.c} bien, ${r.w} mal.</p>` : ''}`;
  abrirModal(h, 'Pregunta ' + q.id);
}
function modalSorpresa(oferta) {
  const h = `<div class="sorpresa">${ICON.concha(56, 'var(--azul)')}<h2>${esc(oferta.titulo)}</h2>
    <p>${oferta.etapa ? `Has terminado la etapa ${oferta.etapa}. ` : ''}10 preguntas de lo que ya has estudiado, sobre todo de las que más te cuestan. Es opcional.</p>
    <div class="fila-btns"><button class="btn btn-amarillo" data-accion="aceptar-sorpresa">Hacerlo ahora</button><button class="btn btn-sec" data-accion="saltar-sorpresa">Saltar</button></div></div>`;
  ofertaPendiente = oferta;
  abrirModal(h, oferta.titulo);
}
let ofertaPendiente = null;
function modalConfirmar(texto, accion, boton) {
  abrirModal(`<div class="sorpresa"><h2>${esc(texto)}</h2><div class="fila-btns" style="margin-top:16px"><button class="btn" style="background:var(--rojo)" data-accion="${accion}">${esc(boton)}</button><button class="btn btn-sec" data-accion="cerrar">Cancelar</button></div></div>`, texto);
}

let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('ver'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('ver'), 3200); }

// ============================================================ Acciones
function empezarRonda(key) {
  const r = RONDA[key]; if (!r) return;
  if (!rondaDesbloqueada(RONDAS.indexOf(r))) return;
  if (S.active && S.active.tipo === 'ronda' && S.active.key === key) return ir('sesion');
  descartarSesion();
  nuevaSesion('ronda', r.ids, { key, titulo: `Etapa ${r.tarea}, ronda ${r.num}` });
  ir('sesion');
}
function empezarPractica(ids, titulo, tipo = 'practica', extra = {}) {
  if (!ids.length) { toast('No hay preguntas para practicar todavía.'); return; }
  descartarSesion();
  nuevaSesion(tipo, ids, Object.assign({ titulo }, extra));
  ir('sesion');
}
async function exportar() {
  const datos = JSON.stringify({ app: 'camino-ccse', exportado: new Date().toISOString(), estado: S });
  // Dentro de claude.ai las descargas pasan por la capacidad "downloads"
  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: `progreso-ccse-${hoy()}.json`, data: datos }); toast('Progreso exportado'); return; }
    catch (e) { if (e && e.code !== 'unavailable') return; }
  }
  try {
    const blob = new Blob([datos], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `progreso-ccse-${hoy()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Progreso exportado');
  } catch (e) {
    abrirModal(`<div class="dialogo-cab"><h2>Copia este texto</h2><button class="btn-x" data-accion="cerrar" aria-label="Cerrar">${ICON.x()}</button></div><textarea class="buscar" readonly>${esc(datos)}</textarea>`, 'Exportar');
  }
}
function importarTexto(txt) {
  try {
    const d = JSON.parse(txt);
    const est = d.estado || d;
    if (!est || typeof est.q !== 'object' || typeof est.rounds !== 'object') throw new Error('formato');
    S = migrar(Object.assign(estadoInicial(), est)); aplicarMigracionRondas();
    guardar(); toast('Progreso importado'); ir('camino');
  } catch (e) { toast('Ese archivo no es una copia de progreso válida.'); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-cerrar-velo]');
  if (!el) return;
  if (el.hasAttribute('data-cerrar-velo')) { if (e.target === el) cerrarModal(); return; }
  const d = el.dataset;
  if (d.op && S.active && S.active.fase === 'responder') { S.active.sel = d.op; guardar(); render(); const b = $(`[data-op="${d.op}"]`); if (b) b.focus(); return; }
  if (d.ir !== undefined) { if (d.ir === 'biblioteca') params = {}; return ir(d.ir); }
  if (d.ronda) return empezarRonda(d.ronda);
  if (d.ficha) return modalFicha(d.ficha);
  if (d.esqNodo !== undefined) return elegirNodo(d.esqNodo || null);
  if (d.esq) return abrirEsquema(d.esq, d.esqQ || null);
  if (d.practicarEsq) return empezarPractica(weightedPick(idsEsquema(d.practicarEsq), 10, pesoRepaso), `Esquema: ${ESQ[d.practicarEsq].corto}`);
  if (d.ver) return modalPregunta(d.ver);
  if (d.bib !== undefined) return ir('biblioteca', d.bib ? { tarea: Number(d.bib) } : {});
  if (d.modo) { modoSim = d.modo; return render(); }
  if (d.serie) { numSerie = Number(d.serie); return render(); }
  if (d.repetir !== undefined) { const ex = S.exams[Number(d.repetir)]; if (ex) empezarSimulacro(ex.ids, ex.codigo + ' (repetición)', ex.modo, hashStr(ex.codigo) ^ Date.now(), null); return; }
  if (d.ajuste) {
    let v = d.valor; if (d.ajuste === 'fs') v = Number(v); if (d.ajuste === 'vibrar') v = v === 'true';
    S.settings[d.ajuste] = v; guardar(); return render();
  }
  if (d.practicarTarea) {
    const t = Number(d.practicarTarea);
    const vistas = IDS_T(t).filter(id => S.q[id]);
    return empezarPractica(weightedPick(vistas, 10, pesoRepaso), `Práctica de la tarea ${t}`);
  }
  if (d.practicarSub) { const ids = D.questions.filter(q => q.subtema === d.practicarSub).map(q => q.id); return empezarPractica(ids, d.practicarSub); }
  switch (d.accion) {
    case 'comprobar': return comprobar();
    case 'siguiente': return siguiente();
    case 'salir': return abandonarSesion();
    case 'reanudar': return ir('sesion');
    case 'descartar': descartarSesion(); return render();
    case 'pausa': {
      const ses = S.active; if (!ses) return;
      if (ses.pausa) { ses.pausa = false; arrancarReloj(ses); } else { pararReloj(ses); ses.pausa = true; }
      guardar(); return render();
    }
    case 'empezar-sim': {
      const sim = generarSimulacro(modoSim, numSerie);
      return empezarSimulacro(sim.ids, sim.codigo, modoSim, sim.seed, modoSim === 'serie' ? numSerie : null);
    }
    case 'practicar-fallos': { const r = S.ultimoResumen; return empezarPractica(r.fallos, 'Practicar mis fallos'); }
    case 'repasar-debiles': {
      const deb = D.questions.filter(q => S.q[q.id] && S.q[q.id].weak).map(q => q.id);
      return empezarPractica(weightedPick(deb, 10, id => 1 + S.q[id].w), 'Repaso de fallos');
    }
    case 'repasar-afianzar': {
      const ids = D.questions.filter(q => est(q.id) === 'acertada').map(q => q.id);
      return empezarPractica(shuffle(ids).slice(0, 10), 'Afianzar lo aprendido');
    }
    case 'control': {
      const t = Number(d.etapa);
      return empezarPractica(weightedPick(IDS_T(t), 10, pesoRepaso), `Control de la etapa ${t}`, 'control', { etapa: t });
    }
    case 'aceptar-sorpresa': {
      const o = ofertaPendiente; ofertaPendiente = null; cerrarModal();
      return empezarPractica(o.ids, o.titulo, 'control', { etapa: o.etapa });
    }
    case 'saltar-sorpresa': {
      const o = ofertaPendiente; ofertaPendiente = null;
      if (o && o.etapa) S.controles[o.etapa] = S.controles[o.etapa] || 'saltado';
      guardar(); cerrarModal(); toast('Saltado. Puedes hacerlo luego desde el mapa.'); return;
    }
    case 'cerrar': return cerrarModal();
    case 'exportar': return exportar();
    case 'importar': {
      const inp = $('#archivo-import'); if (inp) inp.click(); return;
    }
    case 'reiniciar': return modalConfirmar('¿Borrar todo tu progreso? No se puede deshacer.', 'reiniciar-ok', 'Borrar todo');
    case 'reiniciar-ok': S = estadoInicial(); guardar(); cerrarModal(); toast('Progreso borrado'); return ir('camino');
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'archivo-import' && e.target.files[0]) {
    const fr = new FileReader(); fr.onload = () => importarTexto(String(fr.result)); fr.readAsText(e.target.files[0]);
  }
});
document.addEventListener('input', e => { if (e.target.id === 'buscar') { filtroTexto = e.target.value; pintarBusqueda(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalAbierto()) { cerrarModal(); return; }
  if (pantalla !== 'sesion' || !S.active || modalAbierto()) return;
  if (e.target.matches('input, textarea')) return;
  const ses = S.active, q = Q[ses.cola[0]];
  if (ses.fase === 'responder') {
    const orden = ordenOpciones(ses, q.id);
    const k = e.key.toLowerCase();
    let idx = -1;
    if (q.tipo === 'vf') { if (k === 'v' || k === '1') idx = 0; if (k === 'f' || k === '2') idx = 1; }
    else { idx = ['1', '2', '3'].indexOf(k); if (idx < 0) idx = ['a', 'b', 'c'].indexOf(k); }
    if (idx >= 0 && orden[idx]) { ses.sel = orden[idx]; render(); e.preventDefault(); return; }
    if (e.key === 'Enter' && ses.sel && !e.target.matches('.opcion')) { e.preventDefault(); comprobar(); return; }
    if (e.key === 'Enter' && ses.sel && e.target.matches('.opcion')) { e.preventDefault(); comprobar(); return; }
  } else if (e.key === 'Enter' && !e.target.closest('details, [data-ficha], [data-esq]')) { e.preventDefault(); siguiente(); }
});

// Tras terminar una ronda, ofrecer examen sorpresa (aleatorio) o control de etapa.
const _irOriginal = ir;
ir = function (p, prm = {}, push = true) {
  _irOriginal(p, prm, push);
  if (p === 'resumen' && S.ultimoResumen && !S.ultimoResumen.ofertado) {
    S.ultimoResumen.ofertado = true;
    const o = quizaSorpresa(S.ultimoResumen);
    guardar();
    if (o) setTimeout(() => modalSorpresa(o), 450);
  }
};

// ============================================================ Inicio
try { history.replaceState({ p: 'camino', prm: {} }, ''); } catch (e) { /* sin history */ }
render();
Nube.iniciar();

// ============================================================ Web app instalable (funciona sin conexión)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* sin modo offline */ }); });
}

</script>
</body>
