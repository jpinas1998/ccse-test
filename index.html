ldad y el pluralismo político.","La soberanía nacional corresponde al pueblo español; de él derivan todos los poderes del Estado.","Separación de poderes: ejecutivo (Gobierno), legislativo (Cortes Generales) y judicial (jueces y magistrados).","España es una patria común e indivisible; la Constitución reconoce el derecho a la autonomía de nacionalidades y regiones y la solidaridad entre ellas.","Principios: respeto a los derechos humanos y a las leyes, protección de las diferencias de los pueblos de España, vida digna y cooperación con todos los pueblos de la Tierra."],"ojo":["Valores superiores: libertad, justicia, igualdad y pluralismo político. La «fraternidad» es del lema francés y la «solidaridad» es entre comunidades, no un valor superior.","Ni república ni federal: monarquía parlamentaria con comunidades autónomas.","La soberanía es del pueblo, no del Gobierno ni del Congreso.","La Constitución la aprobaron los ciudadanos en referéndum, no el Tribunal Constitucional (que solo la interpreta)."],"pags":[6,9,59]},{"id":"t1-organismos","tarea":1,"subtema":"Organismos públicos","titulo":"Organismos públicos españoles","puntos":["Organismos que pertenecen a ministerios: AEMET (meteorología), Agencia Tributaria (AEAT), DGT (tráfico), ICEX (comercio exterior), Banco de España, Instituto Cervantes, Instituto de las Mujeres, INE (estadística), Patrimonio Nacional y Turespaña.","Son organismos españoles: no son europeos, internacionales ni ONG.","La Agencia Tributaria depende del Ministerio de Hacienda y Función Pública y recauda los impuestos.","La Agencia Tributaria también aplica el sistema tributario en general.","Órganos consultivos del Gobierno: el Consejo de Estado y el Consejo Económico y Social."],"ojo":["Recaudar impuestos = Agencia Tributaria; controlar las cuentas públicas = Tribunal de Cuentas.","El Consejo Económico y Social aconseja al Gobierno; no recauda ni controla."],"pags":[11,12]},{"id":"t1-admin-electronica","tarea":1,"subtema":"Administración electrónica","titulo":"La Administración electrónica","puntos":["Muchos trámites se hacen por internet: pedir un certificado, pagar tasas e impuestos, inscribirse en el padrón, solicitar ayudas, consultar expedientes.","Cada ministerio u organismo tiene su sede electrónica (su web oficial para hacer trámites).","Cualquier ciudadano puede hacer trámites en línea, pero necesita una identidad digital.","Identidad digital: DNI electrónico, certificado digital o Cl@ve.","Todos sirven como firma electrónica, con el mismo valor que una firma en papel.","Los trámites en línea están disponibles en cualquier momento, no solo en horario de oficina.","Puedes consultar en línea cómo va tu expediente en cualquier momento.","El 060 es el teléfono de información de la Administración General del Estado.","El Portal de la Administración Electrónica (PAe) es una web oficial del Gobierno sobre la transformación digital de la Administración."],"ojo":["060 = información de la Administración; 112 = emergencias.","El DNI y el pasaporte los expide la Policía Nacional; lo típico en la sede electrónica es pagar impuestos o tasas.","Firma electrónica sí; firma en papel o pasaporte no sirven para internet."],"pags":[14,15]},{"id":"t1-lenguas","tarea":1,"subtema":"Lenguas e instituciones lingüísticas","titulo":"Lenguas de España y sus instituciones","puntos":["El castellano (o español) es la lengua oficial de toda España.","Todos los españoles tienen el derecho de usar el castellano y el deber de conocerlo.","Las demás lenguas son también oficiales (cooficiales) en sus comunidades autónomas, según sus estatutos.","Gallego: Galicia. Vasco o euskera: País Vasco y Navarra.","Catalán: Cataluña, Islas Baleares y Comunidad Valenciana (allí, catalán o valenciano).","Aranés: Cataluña (Valle de Arán).","La enseñanza de las lenguas cooficiales es competencia de las comunidades autónomas.","Normalización (fijar las normas): RAE, Institut d'Estudis Catalans, Acadèmia Valenciana de la Llengua, Real Academia Galega, Euskaltzaindia.","Difusión y promoción: Instituto Cervantes (español), Institut Ramon Llull (catalán), Instituto Vasco Etxepare (euskera)."],"tabla":{"cabecera":["Lengua","Normalización (normas)","Difusión y promoción"],"filas":[["Castellano o español","Real Academia Española (RAE)","Instituto Cervantes"],["Catalán","Institut d'Estudis Catalans","Institut Ramon Llull; Institut d'Estudis Baleàrics"],["Valenciano","Acadèmia Valenciana de la Llengua","Direcció General de Política Lingüística i Gestió del Multilingüisme"],["Gallego","Real Academia Galega","Secretaría Xeral de Política Lingüística"],["Vasco o euskera","Real Academia de la Lengua Vasca-Euskaltzaindia","Instituto Vasco Etxepare; Instituto Navarro del Vascuence-Euskarabidea"]]},"ojo":["Academia = normas (normalización); Instituto = difusión. La RAE normaliza, el Cervantes difunde.","Bable (Asturias), aragonés y murciano NO son lenguas cooficiales.","El castellano es oficial también en las comunidades con lengua propia.","Etxepare = euskera (no gallego ni bable)."],"pags":[7]},{"id":"t1-fuerzas","tarea":1,"subtema":"Fuerzas Armadas y de Seguridad","titulo":"Fuerzas Armadas y policías","puntos":["Fuerzas Armadas: garantizan la autoridad y la independencia de España y defienden su integridad territorial y el orden constitucional.","Están formadas por el Ejército de Tierra, el Ejército del Aire y la Armada.","Su máxima autoridad es el rey; la dirección corresponde al Ministerio de Defensa.","Participan en misiones de paz de la ONU desde 1989.","Fuerzas y Cuerpos de Seguridad del Estado (ámbito nacional): Policía Nacional y Guardia Civil; mando superior: ministro del Interior.","Policía Nacional: DNI y pasaporte, extranjería (documentos, permisos de residencia y trabajo) y control de entrada y salida de España.","Guardia Civil: tráfico en vías interurbanas (carreteras), puertos, aeropuertos, fronteras y costas.","Policías autonómicas: Ertzaintza (País Vasco), Mossos d’Esquadra (Cataluña), Policía Foral (Navarra), Policía de Canarias.","Policía local: protege instituciones locales, regula el tráfico en pueblos y ciudades y ayuda en accidentes."],"tabla":{"cabecera":["Cuerpo","Ámbito","Qué hace / dónde"],"filas":[["Policía Nacional","Nacional","DNI, pasaporte, extranjería, control de entradas y salidas"],["Guardia Civil","Nacional","Carreteras, puertos, aeropuertos, fronteras y costas"],["Ertzaintza","Autonómico","País Vasco"],["Mossos d’Esquadra","Autonómico","Cataluña"],["Policía Foral","Autonómico","Navarra"],["Policía local","Local","Tráfico en pueblos y ciudades, auxilio en accidentes"]]},"ojo":["La Guardia Civil NO es Fuerzas Armadas: es Fuerza de Seguridad.","Pasaportes en la frontera = Policía Nacional; vigilar fronteras, costas, puertos y aeropuertos = Guardia Civil.","Tráfico en carretera = Guardia Civil; tráfico en la ciudad = Policía local.","Ertzaintza = País Vasco; Mossos = Cataluña (no al revés).","Defender el territorio = Fuerzas Armadas, no la policía."],"pags":[10,11]},{"id":"t1-banderas","tarea":1,"subtema":"Símbolos (banderas)","titulo":"Las banderas","puntos":["La bandera de España tiene tres franjas: roja, amarilla y roja.","Cada comunidad autónoma (todas) tiene su propia bandera.","La bandera autonómica se usa junto a la española en los edificios públicos y en los actos oficiales.","La bandera de la Unión Europea es azul con 12 estrellas amarillas en círculo."],"ojo":["La bandera española no tiene blanco: solo rojo y amarillo.","Todas las comunidades tienen bandera, no solo las que tienen lengua propia.","La bandera de España está en todos los edificios públicos, no solo en días de fiesta."],"pags":[6,7,8]},{"id":"t1-corona","tarea":1,"subtema":"La Corona","titulo":"La Corona","puntos":["El rey es el jefe del Estado y tiene la máxima representación.","Su papel es actuar como mediador (moderador) y garantizar el buen funcionamiento de las instituciones.","Aprueba y ordena publicar las leyes y nombra a los miembros del Gobierno a propuesta del presidente.","Tiene el mando supremo de las Fuerzas Armadas.","La Corona es el símbolo de la unidad de España.","Pueden reinar tanto hombres como mujeres; la Corona es hereditaria.","El heredero o heredera tiene el título de Príncipe o Princesa de Asturias.","Residencia oficial: Palacio Real; vive en el Palacio de la Zarzuela.","Juan Carlos I reinó de 1975 a 2014 e impulsó el proceso hacia la democracia.","Felipe VI, su hijo, es rey desde el 19 de junio de 2014."],"ojo":["Jefe del Estado = rey; jefe del Gobierno = presidente.","Zarzuela = rey; Moncloa = presidente; Palacio Real = residencia oficial del rey (pero no vive allí).","1975 = empieza Juan Carlos I; 2014 = empieza Felipe VI.","Mando supremo de las Fuerzas Armadas: el rey (no el presidente ni el ministro de Defensa)."],"pags":[8,10]},{"id":"t1-territorial","tarea":1,"subtema":"Organización territorial y competencias","titulo":"Organización territorial y competencias","puntos":["España se organiza en comunidades autónomas, provincias y municipios.","Tres niveles de Administración: central (Estado), autonómica (comunidades) y local (provincias y municipios).","Hay 17 comunidades autónomas, 2 ciudades autónomas (Ceuta y Melilla), 50 provincias y 8132 municipios.","La ley básica de cada comunidad es su Estatuto de Autonomía.","Competencias más importantes de las comunidades: sanidad y educación.","Competencias exclusivas del Estado: nacionalidad, extranjería, inmigración, relaciones internacionales y administración de justicia.","Instituciones autonómicas: asamblea legislativa (parlamento), consejo de gobierno (presidente y consejeros) y presidente.","El delegado del Gobierno representa al Estado en cada comunidad autónoma.","Provincias: las gobierna la Diputación; en Canarias, los cabildos; en Baleares, los consejos insulares; las comunidades uniprovinciales no tienen diputación.","Municipios: los gobierna el ayuntamiento (alcalde y concejales), elegido en las elecciones municipales.","Competencias del ayuntamiento: patrimonio histórico, medio ambiente, urbanismo, agua, alumbrado, instalaciones culturales y deportivas."],"tabla":{"cabecera":["Nivel","Territorio","Órgano de gobierno"],"filas":[["Central","Estado","Gobierno (presidente y ministros)"],["Autonómico","Comunidad autónoma","Consejo de gobierno (presidente y consejeros)"],["Local","Provincia","Diputación (cabildos en Canarias, consejos insulares en Baleares)"],["Local","Municipio","Ayuntamiento (alcalde y concejales)"]]},"ojo":["Cabildos = Canarias; consejos insulares = Baleares.","Ministros = Gobierno de España; consejeros = gobierno autonómico; concejales = ayuntamiento.","Delegado del Gobierno (representa al Estado) no es lo mismo que el presidente de la comunidad.","Provincias y municipios = Administración local, no autonómica.","Sanidad = comunidad; extranjería y relaciones internacionales = Estado; agua y alumbrado = ayuntamiento."],"pags":[12,13,14]},{"id":"t1-gobierno","tarea":1,"subtema":"Gobierno y presidentes","titulo":"El Gobierno y sus presidentes","puntos":["El Gobierno es el órgano superior del poder ejecutivo.","Dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado.","Está formado por el presidente, uno o varios vicepresidentes y los ministros.","Tiene su sede en Madrid.","El presidente vive en el Palacio de la Moncloa (residencia oficial).","Los miembros del Gobierno juran o prometen el cargo ante la Constitución, en presencia del rey.","Desde 1978 ha habido 7 presidentes de 3 partidos (UCD, PSOE y PP); según el manual, ninguna mujer.","El primer presidente de la democracia fue Adolfo Suárez (UCD)."],"tabla":{"cabecera":["Período","Presidente","Partido"],"filas":[["1979-1981","Adolfo Suárez","UCD"],["1981-1982","Leopoldo Calvo-Sotelo","UCD"],["1982-1996","Felipe González","PSOE"],["1996-2004","José María Aznar","PP"],["2004-2011","José Luis Rodríguez Zapatero","PSOE"],["2011-2018","Mariano Rajoy","PP"],["2018-","Pedro Sánchez","PSOE"]]},"ojo":["Ejecutivo = Gobierno; legislativo = Cortes; judicial = jueces.","Política interior y exterior: la dirige el Gobierno, no el rey ni el Congreso.","Moncloa = presidente; Zarzuela = rey.","Manuel Fraga y Yolanda Díaz no han sido presidentes del Gobierno."],"pags":[9,17,59]},{"id":"t1-judicial-control","tarea":1,"subtema":"Poder judicial y órganos de control","titulo":"Poder judicial y órganos de control","puntos":["El poder judicial lo forman jueces y magistrados; administran la justicia.","Principio de unidad jurisdiccional: todos los jueces y tribunales forman un mismo poder judicial.","El Consejo General del Poder Judicial (CGPJ) es el órgano de gobierno de los jueces y garantiza su independencia.","El Tribunal Constitucional interpreta la Constitución y es independiente de los poderes del Estado.","Órganos consultivos del Gobierno: Consejo de Estado y Consejo Económico y Social.","El Defensor del Pueblo atiende las quejas por el mal funcionamiento de las administraciones; lo eligen el Congreso y el Senado para 5 años.","Cualquier ciudadano, español o extranjero, puede presentar una queja al Defensor del Pueblo, y es gratis.","El Tribunal de Cuentas controla las finanzas y el presupuesto de las administraciones y las cuentas de los partidos.","El Defensor del Pueblo y el Tribunal de Cuentas dependen de las Cortes Generales."],"ojo":["Interpretar la Constitución = Tribunal Constitucional; gobernar a los jueces = CGPJ.","No existe el «Poder Constitucional».","Controlar las cuentas = Tribunal de Cuentas; recaudar impuestos = Agencia Tributaria.","Defensor del Pueblo y Tribunal de Cuentas dependen de las Cortes, no del Gobierno ni de Hacienda."],"pags":[10,11,12]},{"id":"t1-cortes-leyes","tarea":1,"subtema":"Cortes Generales y leyes","titulo":"Las Cortes Generales y las leyes","puntos":["Cortes Generales es el nombre oficial del Parlamento español; representan al pueblo español y son el poder legislativo.","Tienen dos cámaras: el Congreso de los Diputados y el Senado.","Funciones: elaborar, debatir y aprobar las leyes y los Presupuestos Generales del Estado, y controlar al Gobierno.","El Congreso tiene 350 diputados, elegidos por provincias.","El Senado tiene hoy 265 senadores; la mayoría los eligen los ciudadanos y el resto, las comunidades autónomas.","El Senado es la cámara de representación territorial.","En el Congreso se hace la investidura del presidente del Gobierno (a propuesta del rey), y allí se debaten cuestiones de confianza y mociones de censura.","El presidente del Congreso es la tercera autoridad del Estado.","Tipos de leyes: ley orgánica (derechos fundamentales, estatutos), decreto ley (Gobierno, urgencia) y ley ordinaria (mayoría simple).","Proyecto de ley = lo propone el Gobierno; proposición de ley = la proponen el Congreso, el Senado, una comunidad autónoma o al menos 500 000 ciudadanos.","Una ley aprobada necesita desarrollarse con reglamentos u órdenes ministeriales.","Las leyes se publican en el Boletín Oficial del Estado (BOE)."],"ojo":["Cortes Generales = Congreso + Senado (no el Tribunal Supremo ni el Consejo de Estado).","Al presidente del Gobierno lo elige el Congreso; el rey solo lo propone.","Los presupuestos los aprueban las Cortes, no el Gobierno.","350 diputados; 500 000 firmas.","Tercera autoridad: presidente del Congreso, no del Senado.","BOE publica leyes; PAe es el portal de la Administración electrónica; el INE hace estadísticas."],"pags":[9,10,14]},{"id":"t1-poblacion","tarea":1,"subtema":"Población","titulo":"Población de España","puntos":["Según el manual, España tenía en 2025 más de 49 millones de habitantes.","Es el cuarto país más poblado de la UE (después de Alemania, Francia e Italia).","Es el segundo país más extenso de la UE: 505 944 km² y 96 habitantes por km².","Las diez ciudades más pobladas, por orden: Madrid, Barcelona, Valencia, Sevilla, Zaragoza, Málaga, Murcia, Palma de Mallorca, Las Palmas de Gran Canaria y Alicante.","La comunidad más poblada es Andalucía, seguida de Cataluña y Madrid."],"tabla":{"cabecera":["Comunidad autónoma","Habitantes (según el manual)"],"filas":[["Andalucía","8 631 862"],["Cataluña","8 012 231"],["Madrid","7 009 268"],["Comunidad Valenciana","5 319 285"],["Galicia","2 705 833"]]},"ojo":["49 millones, no 67 (eso es Francia) ni 95.","Andalucía es más poblada que Cataluña, aunque la diferencia es pequeña.","Málaga sí está entre las 10 más pobladas; Cádiz y Albacete no.","Son datos que cambian: responde siempre según el manual."],"pags":[15,16]},{"id":"t1-ue-internacional","tarea":1,"subtema":"UE y organismos internacionales","titulo":"España en la UE y en el mundo","puntos":["España entró en la Comunidad Económica Europea (hoy Unión Europea) el 1 de enero de 1986.","Ha tenido cinco veces la Presidencia semestral del Consejo de la UE: 1989, 1995, 2002, 2010 y 2023.","La bandera de la UE es azul con 12 estrellas amarillas en círculo.","España también pertenece a la ONU, el Consejo de Europa, la OTAN, el FMI y el Banco Mundial.","La Comunidad Iberoamericana de Naciones: 19 países de América Latina + España, Portugal y Andorra (22); su organismo de apoyo es la Secretaría General Iberoamericana.","Cada cinco años hay elecciones europeas para elegir a los eurodiputados españoles del Parlamento Europeo."],"ojo":["En las elecciones europeas se eligen eurodiputados, no ministros.","España no pertenece a la CEI ni a la Unión Económica Euroasiática.","Elecciones europeas cada 5 años; generales, autonómicas y municipales cada 4."],"pags":[8,9,16]},{"id":"t1-participacion","tarea":1,"subtema":"Participación: elecciones, partidos, sindicatos","titulo":"Elecciones, partidos y sindicatos","puntos":["El voto es un derecho: sufragio universal, libre, igual, directo y secreto.","Pueden votar y ser elegidos todos los españoles mayores de 18 años.","En las elecciones municipales también votan los residentes de la UE y de algunos países con acuerdos con España.","Las elecciones las convoca el rey y se celebran cada cuatro años.","Generales: diputados y senadores. Autonómicas: parlamentos autonómicos. Municipales: concejales (y así el ayuntamiento con su alcalde).","Europeas: cada cinco años, para elegir eurodiputados.","España tiene un sistema pluripartidista: hay muchos partidos (por ejemplo, PSOE, PP, antes UCD).","El artículo 22 reconoce el derecho de asociación; las asociaciones deben inscribirse en un registro.","Los sindicatos defienden los intereses de los trabajadores y participan en el Consejo Económico y Social."],"ojo":["Votar es un derecho, no una obligación.","Extranjeros: solo en municipales (y solo algunos).","Edad para votar: 18 años.","PP es un partido; PIB es un dato económico; UE es la Unión Europea.","Sindicato = trabajadores; partido = política; asociación = término general."],"pags":[16,17]},{"id":"t2-libertad-ideologica","tarea":2,"subtema":"Libertad ideológica y religiosa","titulo":"Libertad ideológica y religiosa (artículo 16)","puntos":["Artículo 16: se garantiza la libertad ideológica y religiosa de las personas y de las comunidades.","Esta libertad está garantizada en todo el territorio español, sin excepciones.","Nadie puede ser obligado a decir cuáles son sus ideas políticas o religiosas.","No hay ninguna religión oficial en España: es un Estado aconfesional.","Nadie está obligado a practicar una religión.","Aunque no hay religión oficial, el manual recuerda que en España hay una fuerte tradición católica."],"ojo":["Aconfesional no significa que la religión esté prohibida: significa que el Estado no tiene religión oficial.","Las frases con «solo en parte del territorio» u «obligar a declarar» son falsas.","La tradición católica no convierte al catolicismo en religión oficial."],"pags":[29,10]},{"id":"t2-nacionalidad-voto","tarea":2,"subtema":"Nacionalidad y voto","titulo":"Mayoría de edad, participación y voto","puntos":["Artículo 12: los españoles son mayores de edad a los 18 años.","Artículo 23: los ciudadanos pueden participar en política presentándose a las elecciones o eligiendo a sus representantes.","Tienen derecho al voto todos los españoles mayores de 18 años, salvo que una sentencia judicial les haya quitado ese derecho.","No hay que esperar ningún plazo después de obtener la nacionalidad: un español por residencia vota igual que cualquier otro español.","El sufragio es universal, libre, igual, directo y secreto.","En las elecciones municipales también pueden votar los residentes de la Unión Europea y de algunos países con acuerdos con España.","Votar es un derecho, no una obligación."],"ojo":["No existe ningún periodo de espera de «tres años» para votar tras la nacionalidad.","La única forma de perder el voto que menciona el manual es una sentencia judicial.","Los extranjeros con acuerdo solo votan en las municipales, no en las generales."],"pags":[28,30,16]},{"id":"t2-integridad-intimidad","tarea":2,"subtema":"Integridad, intimidad y datos","titulo":"Vida, intimidad, domicilio y datos (artículos 15, 18 y 20)","puntos":["Artículo 15: todos tienen derecho a la vida y a la integridad física y moral.","Se elimina la pena de muerte y se prohíbe la tortura.","Artículo 18: se garantiza el derecho al honor y a que se respete la vida familiar y personal.","El domicilio es inviolable: nadie puede entrar sin permiso del titular.","La policía solo puede entrar con autorización judicial o si se está cometiendo un delito.","Se garantiza el secreto de las comunicaciones (postales, telegráficas y telefónicas), salvo resolución judicial.","La ley limita el uso de la informática y el acceso de terceras personas a los datos personales.","Artículo 20: la libertad de expresión y de prensa no tiene censura, pero su límite es el honor, la intimidad, la propia imagen y la protección de la juventud y la infancia."],"ojo":["La policía no puede entrar «en cualquier momento»: necesita orden judicial o flagrante delito.","Sin censura no significa sin límites: la prensa debe respetar el honor de las personas.","El juez es la llave tanto para entrar en una casa como para levantar el secreto de las comunicaciones."],"pags":[29]},{"id":"t2-asociacion-sindicatos","tarea":2,"subtema":"Asociación, partidos, sindicatos y huelga","titulo":"Asociación, partidos, sindicatos y huelga (artículos 6, 22, 28 y 37)","puntos":["Artículo 6: los partidos políticos expresan el pluralismo político; su creación es libre dentro de la Constitución y la ley.","La estructura y el funcionamiento de los partidos deben ser democráticos.","Artículo 22: se reconoce el derecho de asociación; las asociaciones deben inscribirse en un registro.","Están prohibidas las asociaciones con fines ilegales.","Artículo 28: todos pueden pertenecer a cualquier sindicato.","Se reconoce el derecho a la huelga de los trabajadores, manteniendo los servicios mínimos.","Los sindicatos más representativos negocian con empresarios y gobiernos y participan en el Consejo Económico y Social.","Artículo 37: la ley garantiza la negociación colectiva entre trabajadores y empresarios y el cumplimiento de los convenios."],"ojo":["Crear un partido es libre, pero su funcionamiento tiene que ser democrático.","La huelga es un derecho, pero con servicios mínimos.","Sindicato = defiende a los trabajadores; partido = participa en política; asociación = término general."],"pags":[28,30,31,17]},{"id":"t2-circulacion-residencia","tarea":2,"subtema":"Libertad de circulación y residencia","titulo":"Libertad de residencia y circulación (artículo 19)","puntos":["Artículo 19: los españoles pueden elegir libremente dónde quieren vivir.","Eso incluye elegir la ciudad o la comunidad autónoma en la que quieres vivir.","Pueden desplazarse libremente por todo el territorio español.","Pueden entrar y salir de España libremente.","Este derecho no se puede limitar por motivos políticos o ideológicos."],"ojo":["Limitar la entrada o salida de España por ideas políticas o ideológicas está prohibido: esa afirmación es siempre falsa.","La libertad de circulación vale para todo el territorio, no solo para una comunidad."],"pags":[29]},{"id":"t2-educacion","tarea":2,"subtema":"Educación y libertad de cátedra","titulo":"Educación y libertad de cátedra (artículos 20 y 27)","puntos":["Artículo 27: todos tienen derecho a la educación y se reconoce la libertad de enseñanza.","La enseñanza básica es obligatoria y gratuita.","La enseñanza básica tiene dos etapas: Educación Primaria (de 6 a 12 años) y Educación Secundaria Obligatoria, ESO (de 12 a 16 años).","Artículo 20: los profesores pueden impartir sus enseñanzas con libertad (libertad de cátedra).","La Educación Infantil no es obligatoria y el Bachillerato tampoco."],"ojo":["La educación es para todos, no «solo para los extranjeros» ni solo para los españoles.","Obligatoria = de 6 a 16 años; fuera de ese tramo no es obligatoria.","No confundas el artículo 27 (derecho a la educación) con el 20 (libertad de los profesores)."],"pags":[29,30,76,77]},{"id":"t2-salud-seguridad-social","tarea":2,"subtema":"Salud, Seguridad Social, vivienda, medio ambiente","titulo":"Salud, Seguridad Social, vivienda y medio ambiente (artículos 41, 43, 45 y 47)","puntos":["Artículo 41: todos los ciudadanos tienen acceso a una Seguridad Social pública, especialmente los que no tienen trabajo.","Artículo 43: los poderes públicos deben proteger la salud y promover la educación sanitaria, la educación física y el deporte.","La sanidad pública es para todos y, según la clave oficial, es gratuita; para usarla se necesita la tarjeta sanitaria.","Los mayores de 65 años reciben ayudas extra de las comunidades autónomas (por ejemplo, medicamentos más baratos), pero la sanidad no es solo para ellos.","Artículo 45: todos tienen derecho a un medio ambiente adecuado y el deber de conservarlo.","Artículo 47: todos los españoles tienen derecho a una vivienda digna y adecuada."],"ojo":["La Seguridad Social protege especialmente a los desempleados: «excepto los desempleados» es falso.","La sanidad no es «solo para mayores de 65 años».","El medio ambiente es a la vez un derecho y un deber."],"pags":[31,80,81,82]},{"id":"t2-igualdad","tarea":2,"subtema":"Igualdad y no discriminación","titulo":"Igualdad y no discriminación (artículos 10 y 14)","puntos":["La Constitución recoge los derechos de los españoles, dentro y fuera de España, y de los residentes extranjeros.","Artículo 10: los derechos fundamentales se interpretan según la Declaración Universal de los Derechos Humanos y los tratados firmados por España.","Artículo 14: los españoles son iguales ante la ley.","No puede haber discriminación por nacimiento, raza, sexo, religión o cualquier otra condición o circunstancia personal o social.","Hombres y mujeres tienen los mismos derechos."],"ojo":["La Constitución no reconoce «únicamente» los derechos de los españoles: también los de los residentes extranjeros.","La prohibición de discriminación cubre «cualquier» circunstancia personal o social, no solo una lista cerrada."],"pags":[28]},{"id":"t2-justicia","tarea":2,"subtema":"Justicia","titulo":"Justicia (artículos 117, 118 y 119)","puntos":["Artículo 117: la justicia surge del pueblo y la administran jueces y magistrados de forma independiente y responsable.","El Consejo General del Poder Judicial es el órgano de gobierno de los jueces y garantiza su independencia.","Artículo 118: hay que cumplir las sentencias de los jueces y tribunales.","También hay que colaborar con los jueces y tribunales cuando lo pidan.","Artículo 119: la justicia es gratuita cuando lo dice la ley y, siempre, para quien no tiene recursos económicos."],"ojo":["Los jueces no siguen indicaciones del Gobierno: son independientes.","Colaborar con la justicia es un deber, no algo voluntario."],"pags":[32,10]},{"id":"t2-familia-deberes","tarea":2,"subtema":"Familia y deberes cívicos","titulo":"Matrimonio y deberes cívicos (artículos 30, 31 y 32)","puntos":["Artículo 32: la ley regula las formas de matrimonio, la edad y capacidad para casarse y los derechos y deberes de los cónyuges.","La ley también regula las causas de separación y divorcio y sus efectos.","La edad mínima para casarse es de 16 años, según el manual.","Artículo 30: los españoles tienen el derecho y el deber de defender a España.","Los ciudadanos deben ayudar en casos de grave riesgo, catástrofe o calamidad pública.","Artículo 31: todos deben pagar impuestos para sostener los gastos públicos, según su capacidad económica."],"ojo":["Ayudar en catástrofes es un deber, no solo una recomendación.","Separación y divorcio están regulados por la ley (no por la Iglesia ni por las familias)."],"pags":[30,31]},{"id":"t3-ccaa-capitales","tarea":3,"subtema":"CCAA, capitales y provincias","titulo":"Comunidades autónomas, capitales y provincias","puntos":["España se divide en comunidades autónomas (divididas en provincias) y ciudades autónomas.","Hay 17 comunidades autónomas y 2 ciudades autónomas (Ceuta y Melilla).","Hay 50 provincias, más las ciudades autónomas de Ceuta y Melilla.","Ceuta y Melilla están en la costa norte de África.","Algunas capitales autonómicas no son capital de provincia: Mérida (Extremadura) y Santiago de Compostela (Galicia).","Canarias tiene capitalidad compartida entre Las Palmas de Gran Canaria y Santa Cruz de Tenerife.","Castilla y León no tiene capital oficial: la sede de las administraciones está en Valladolid.","El País Vasco no tiene capital declarada: la sede de las administraciones está en Vitoria.","Hay comunidades de una sola provincia, como Asturias, Cantabria, La Rioja, Madrid, Murcia, Navarra y Baleares."],"ojo":["Castilla y León (Burgos, Valladolid, León…) no es Castilla-La Mancha (Toledo, Cuenca, Guadalajara…).","La capital de la Comunidad Valenciana es Valencia, no Alicante ni Castellón.","La capital de Galicia es Santiago, no La Coruña ni Vigo; la de Extremadura es Mérida, no Cáceres ni Badajoz.","Huesca está en Aragón; Almería, en Andalucía.","España no se divide en «departamentos» ni «distritos»."],"tabla":{"cabecera":["Comunidad o ciudad autónoma","Capital","Provincias"],"filas":[["Andalucía","Sevilla","Almería, Cádiz, Córdoba, Granada, Huelva, Jaén, Málaga, Sevilla"],["Aragón","Zaragoza","Huesca, Teruel, Zaragoza"],["Principado de Asturias","Oviedo","Asturias"],["Islas Baleares","Palma de Mallorca","Baleares"],["Canarias","Compartida: Las Palmas de Gran Canaria y Santa Cruz de Tenerife","Las Palmas, Santa Cruz de Tenerife"],["Cantabria","Santander","Cantabria"],["Castilla-La Mancha","Toledo","Albacete, Ciudad Real, Cuenca, Guadalajara, Toledo"],["Castilla y León","Sin capital oficial (sede de las administraciones: Valladolid)","Ávila, Burgos, León, Palencia, Salamanca, Segovia, Soria, Valladolid, Zamora"],["Cataluña","Barcelona","Barcelona, Gerona, Lérida, Tarragona"],["Comunidad Valenciana","Valencia","Alicante, Castellón, Valencia"],["Extremadura","Mérida","Badajoz, Cáceres"],["Galicia","Santiago de Compostela","La Coruña, Lugo, Orense, Pontevedra"],["La Rioja","Logroño","La Rioja"],["Comunidad de Madrid","Madrid","Madrid"],["Región de Murcia","Murcia","Murcia"],["Comunidad Foral de Navarra","Pamplona","Navarra"],["País Vasco","No declarada (sede de las administraciones: Vitoria)","Álava, Guipúzcoa, Vizcaya"],["Ceuta (ciudad autónoma)","—","—"],["Melilla (ciudad autónoma)","—","—"]]},"pags":[37,40,41,42,12,14]},{"id":"t3-rios-mares","tarea":3,"subtema":"Ríos y mares","titulo":"Ríos, mares e islas","puntos":["España está formada por la mayor parte de la península ibérica, las islas Baleares, las islas Canarias y las ciudades de Ceuta y Melilla.","Las islas Baleares están en el mar Mediterráneo.","Las islas Canarias están en el océano Atlántico.","Ríos que desembocan en el Atlántico: Miño, Duero, Tajo, Guadiana y Guadalquivir.","Ríos que desembocan en el Mediterráneo: Ebro, Júcar, Segura y Turia.","El Ebro es el principal río que desemboca en el Mediterráneo (es el primero de la lista).","En el norte, el mar Cantábrico baña las costas de las comunidades del norte."],"ojo":["El Júcar va al Mediterráneo; el Duero y el Tajo, al Atlántico.","El Guadalquivir va al Atlántico, aunque pase por Andalucía, en el sur.","El Manzanares no aparece entre los grandes ríos del manual."],"pags":[37,38]},{"id":"t3-relieve","tarea":3,"subtema":"Relieve","titulo":"Relieve: Meseta y montañas","puntos":["España es uno de los países más montañosos de Europa, con una altitud media de 650 metros.","Es el cuarto país más grande de Europa: 505 944 km², según el manual.","La Meseta es una extensa llanura en el centro de la península, con más de 600 metros de altura media.","El Sistema Central atraviesa la Meseta de lado a lado.","Principales montañas, de norte a sur: Pirineos, Sistema Central y Sistemas Bético y Penibético.","El monte más alto de España es el Teide, un volcán en Tenerife (Canarias).","El segundo es el Mulhacén, en Sierra Nevada.","El tercero es el Aneto, en los Pirineos."],"ojo":["Meseta = llanura alta; cordillera = cadena de montañas; marisma = terreno bajo y húmedo.","El pico más alto no está en la península, sino en Canarias (Teide).","Aneto (Pirineos) y Mulhacén (Sierra Nevada) se confunden a menudo."],"pags":[37,38]},{"id":"t3-parques","tarea":3,"subtema":"Parques nacionales","titulo":"Parques nacionales","puntos":["La primera Ley de Parques Nacionales es de 1916: España fue de los primeros países de Europa en proteger la naturaleza.","Según el manual, hay 16 parques nacionales, gestionados por la Red de Parques Nacionales.","Ordesa y Monte Perdido: Aragón.","Aigüestortes y Estany de Sant Maurici: Cataluña.","Monfragüe: Extremadura (provincia de Cáceres).","Picos de Europa: Asturias, Castilla y León y Cantabria.","Sierra de Guadarrama: Madrid. Cabañeros y Tablas de Daimiel: Castilla-La Mancha.","Doñana, Sierra Nevada y Sierra de las Nieves: Andalucía. Islas Atlánticas: Galicia.","Archipiélago de Cabrera: Islas Baleares. Caldera de Taburiente, Teide, Timanfaya y Garajonay: Canarias."],"ojo":["Ordesa (Aragón) y Aigüestortes (Cataluña) están los dos en los Pirineos: no los cambies.","Monfragüe está en Extremadura, no en Castilla-La Mancha.","El número de parques puede cambiar con el tiempo: aprende el del manual."],"pags":[39]},{"id":"t3-clima","tarea":3,"subtema":"Clima","titulo":"Climas de España","puntos":["España tiene más de 3000 horas de sol al año: es uno de los países más cálidos de Europa.","Clima oceánico: norte, junto al Cantábrico y el Atlántico; temperaturas suaves y llueve mucho.","Clima mediterráneo: zonas cerca del Mediterráneo; inviernos suaves, veranos calurosos y poca lluvia (a veces intensa).","Clima continental: centro de la península (por ejemplo, Madrid); inviernos fríos, veranos muy calurosos y a veces nieva.","Clima subtropical: islas Canarias; temperaturas suaves todo el año, con una media de 22 ºC."],"ojo":["Madrid tiene clima continental, no mediterráneo.","Canarias es subtropical, no mediterráneo ni oceánico.","España no está entre los países más fríos ni más lluviosos de Europa."],"pags":[39,40]},{"id":"t4-literatura","tarea":4,"subtema":"Literatura","titulo":"Literatura española","puntos":["Dos grandes momentos: el Siglo de Oro (siglos XVI y XVII) y la Edad de Plata (primera mitad del siglo XX).","Miguel de Cervantes (1547-1616), nacido en Alcalá de Henares, escribió El Quijote, la primera novela moderna; sus personajes principales son don Quijote y Sancho Panza.","El Cantar de Mio Cid es del siglo XIII; el Cid fue Rodrigo Díaz de Vivar. Don Juan aparece en El burlador de Sevilla, de Tirso de Molina (1630).","Siglo de Oro: Lope de Vega (Fuenteovejuna), Calderón de la Barca (La vida es sueño), el Lazarillo de Tormes (novela picaresca), Santa Teresa de Jesús, San Juan de la Cruz, Garcilaso, Góngora y Quevedo.","Generación del 98: Antonio Machado, Valle-Inclán y Miguel de Unamuno. Generación de 1914: Ortega y Gasset y Clara Campoamor.","Generación del 27: Federico García Lorca (La casa de Bernarda Alba), Rafael Alberti, M.ª Teresa León, María Zambrano, Miguel Hernández, Rosa Chacel y Vicente Aleixandre (premio Nobel de Literatura).","Posguerra: Camilo José Cela (La colmena), Carmen Laforet (Nada), Ana María Matute (Los hijos muertos) y Miguel Delibes (El camino, Los santos inocentes).","Otras lenguas: Rosalía de Castro (gallego, Follas Novas), Bernardo Atxaga (euskera, Obabakoak) y Mercè Rodoreda (catalán, La plaça del Diamant).","Autores actuales: Eduardo Mendoza, Soledad Puértolas, Antonio Muñoz Molina, Javier Marías, Carlos Ruiz Zafón (La sombra del viento), María Dueñas (El tiempo entre costuras).","Memoria histórica: Almudena Grandes (Episodios de una guerra interminable), Javier Cercas (Soldados de Salamina), Fernando Aramburu (Patria, sobre ETA).","Irene Vallejo escribió El infinito en un junco (historia del libro y la lectura); Sara Mesa, Un amor."],"ojo":["Don Juan y doña Inés no son personajes del Quijote: el compañero de don Quijote es Sancho Panza.","Nada es de Carmen Laforet, no de Ana María Matute (Los hijos muertos) ni de María Dueñas (El tiempo entre costuras).","María Zambrano es de la Generación del 27, pero el Nobel lo ganó Vicente Aleixandre.","Mercè Rodoreda escribe en catalán; Almudena Grandes y Ana María Matute, en castellano.","El camino es de Miguel Delibes; El infinito en un junco, de Irene Vallejo."],"tabla":{"cabecera":["Autor/a","Obra","Época o grupo"],"filas":[["Miguel de Cervantes","El Quijote","Siglo de Oro"],["Lope de Vega","Fuenteovejuna","Siglo de Oro"],["Calderón de la Barca","La vida es sueño","Siglo de Oro"],["Federico García Lorca","La casa de Bernarda Alba","Generación del 27"],["Camilo José Cela","La colmena","Posguerra"],["Carmen Laforet","Nada","Posguerra"],["Ana María Matute","Los hijos muertos","Posguerra"],["Miguel Delibes","El camino / Los santos inocentes","Posguerra"],["Rosalía de Castro","Follas Novas","En gallego"],["Bernardo Atxaga","Obabakoak","En euskera"],["Mercè Rodoreda","La plaça del Diamant","En catalán"],["María Dueñas","El tiempo entre costuras","Actual"],["Irene Vallejo","El infinito en un junco","Actual (ensayo)"]]},"pags":[46,47,48]},{"id":"t4-ciencia","tarea":4,"subtema":"Ciencia","titulo":"Ciencia y tecnología","puntos":["En la Edad Media, Al-Ándalus vivió un gran esplendor científico: en Córdoba se estudiaba medicina, filosofía, matemáticas y astronomía.","Pensadores importantes de esa época: Averroes y Maimónides.","En la Escuela de Traductores de Toledo se tradujeron al latín y al castellano obras escritas en árabe y griego: España fue un puente entre Oriente y Occidente.","El CSIC (Consejo Superior de Investigaciones Científicas) es la mayor institución pública de investigación de España y la cuarta de Europa.","Observatorios y centros: Estación de Villafranca del Castillo (Agencia Espacial Europea, ESA), Observatorio del Teide (Tenerife) y Observatorio de Calar Alto (Almería).","Premios Nobel de Fisiología y Medicina: Santiago Ramón y Cajal (1906) y Severo Ochoa (1959).","Margarita Salas, bioquímica, es la respuesta oficial a «científica española reconocida», aunque el manual no la menciona."],"ojo":["Almudena Grandes es escritora y Montserrat Caballé es soprano: no son científicas.","La RAE se ocupa de la lengua y la SGAE de los derechos de autor; la investigación es el CSIC."],"pags":[56,64]},{"id":"t4-musica-baile","tarea":4,"subtema":"Música y baile","titulo":"Música, baile y folclore","puntos":["Compositores: Manuel de Falla (El amor brujo) y Joaquín Rodrigo (Concierto de Aranjuez).","Cantantes líricos: Montserrat Caballé y Ainhoa Arteta (sopranos); Alfredo Kraus y Josep Carreras (tenores).","Canción moderna: Joan Manuel Serrat y Alejandro Sanz (cantautores); Rosalía, Luz Casal y Enrique Iglesias.","Rosalía es una de las cantantes españolas más famosas de la actualidad (según el manual).","Con la Transición llegó la movida madrileña; Joaquín Sabina es uno de sus artistas.","Flamenco: Lola Flores «la faraona» (cantaora), Camarón de la Isla (cantaor), Paco de Lucía (compositor y guitarrista), Carmen Amaya y Sara Baras (bailaoras).","El flamenco, sobre todo de Andalucía, es Patrimonio Cultural Inmaterial de la Humanidad desde 2010.","Bailes del folclore: la jota (casi toda España), la sardana (Cataluña), la muñeira (Galicia), las sevillanas (Andalucía).","Instrumentos típicos: la guitarra, las castañuelas, la gaita, la dulzaina, el acordeón, el txistu y el tamboril."],"ojo":["El amor brujo es de Falla; el Concierto de Aranjuez, de Rodrigo.","Paco de Lucía es guitarrista; Camarón, cantaor; Sara Baras, bailaora.","Lola Flores es una cantaora del pasado; la cantante famosa actual es Rosalía.","El instrumento del flamenco es la guitarra, no la gaita ni el piano."],"tabla":{"cabecera":["Baile","Región"],"filas":[["Jota","Casi toda España"],["Flamenco","Andalucía"],["Sardana","Cataluña"],["Muñeira","Galicia"],["Sevillanas","Andalucía"]]},"pags":[49,60,61]},{"id":"t4-fiestas","tarea":4,"subtema":"Fiestas y tradiciones","titulo":"Fiestas y tradiciones","puntos":["Navidades: del 24 de diciembre al 6 de enero; belén y árbol de Navidad; villancicos; turrón, mazapán, polvorones y cava.","Nochebuena (24 de diciembre): cena en familia. Nochevieja (31 de diciembre): las 12 uvas.","5 de enero: se dejan los zapatos cerca de la ventana para los regalos y hay cabalgata de los Reyes Magos.","Carnavales: en febrero; los más conocidos, Tenerife y Cádiz (chirigotas).","Fallas de Valencia: en marzo, por San José (19 de marzo); ninots, se queman las fallas.","Semana Santa: marzo o abril, sobre todo en Andalucía; procesiones, pasos, torrijas, saetas.","Sant Jordi: 23 de abril en Cataluña y Baleares; se regalan una rosa y un libro.","Romería del Rocío: en Almonte (Huelva), 50 días después del Domingo de Pascua; carros, sevillanas.","Noche de San Juan: del 23 al 24 de junio en toda España; hogueras.","Sanfermines: en julio en Pamplona (Navarra); encierros, pañuelo rojo y traje blanco.","La Tomatina: último miércoles de agosto en Buñol (Comunidad Valenciana); se tiran tomates.","6 de diciembre: Día de la Constitución (aprobada en referéndum el 6 de diciembre de 1978); 12 de octubre: Fiesta Nacional de España."],"ojo":["Uvas = Nochevieja (31 dic.), no Nochebuena (24 dic.) ni San Juan.","Libros y rosas = Sant Jordi (23 de abril), no San Juan (hogueras, junio).","Fallas = Valencia (marzo); sanfermines = Pamplona (julio).","6 de diciembre = Constitución; 12 de octubre = Fiesta Nacional; 23 de abril = Día del Libro."],"tabla":{"cabecera":["Fiesta","Fecha","Lugar","Símbolo"],"filas":[["Navidades","24 dic. – 6 ene.","Toda España","Belén, villancicos, uvas"],["Carnavales","Febrero","Tenerife, Cádiz","Disfraces, chirigotas"],["Fallas","Marzo (San José, 19)","Valencia","Ninots, quemar fallas"],["Semana Santa","Marzo o abril","Sobre todo Andalucía","Procesiones, torrijas"],["Sant Jordi","23 de abril","Cataluña y Baleares","Rosa y libro"],["Romería del Rocío","50 días tras Pascua","Almonte (Huelva)","Carros, sevillanas"],["San Juan","Noche del 23 al 24 de junio","Toda España","Hogueras"],["Sanfermines","Julio","Pamplona (Navarra)","Encierros, pañuelo rojo"],["La Tomatina","Último miércoles de agosto","Buñol (C. Valenciana)","Tomates"]]},"pags":[61,62,76]},{"id":"t4-cine","tarea":4,"subtema":"Cine","titulo":"Cine español","puntos":["Luis Buñuel: uno de los directores más importantes del cine mundial, relacionado con el surrealismo.","Carlos Saura exploró la memoria histórica; José Luis Garci ganó el primer Óscar del cine español con Volver a empezar (1983).","Pilar Miró destacó por su mirada crítica y por modernizar el cine nacional.","Luis García Berlanga: sátira social. Fernando Trueba: cine cosmopolita.","Más recientes: Pedro Almodóvar, Alejandro Amenábar, Fernando León de Aranoa, J. A. Bayona y Jaume Collet-Serra.","Directoras: Isabel Coixet (La librería), Carla Simón (Verano 1993, Alcarràs), Icíar Bollaín, Pilar Palomero (Las niñas) y Alauda Ruiz de Azúa (Cinco lobitos).","Actores y actrices: Javier Bardem y Penélope Cruz (ganadores de un Óscar), Antonio Banderas, Carmen Maura, Clara Lago, Maribel Verdú, entre otros.","Premios Goya: premian a los mejores profesionales del cine. Festivales: San Sebastián, Sitges, Málaga y Valladolid."],"ojo":["Isabel Coixet y Pilar Miró son directoras; Penélope Cruz, Carmen Maura y Clara Lago son actrices.","Sara Baras no es del cine: es bailaora de flamenco."],"pags":[49,50,63]},{"id":"t4-arte-patrimonio","tarea":4,"subtema":"Arte, arquitectura y patrimonio","titulo":"Arte, arquitectura y patrimonio","puntos":["La UNESCO reconoce 49 bienes españoles como Patrimonio de la Humanidad; España es el tercer país, tras Italia (58) y China (56) (según el manual).","Primeros cinco bienes (1984): la Alhambra y el Generalife (Granada), la Catedral de Burgos, la Mezquita de Córdoba, El Escorial (Madrid) y las obras de Gaudí: Parque Güell, Palacio Güell y Casa Milà (Barcelona).","Después: la Cueva de Altamira, el Acueducto de Segovia, el conjunto arqueológico de Mérida, la Sagrada Familia y el Camino de Santiago, entre otros.","Patrimonio Nacional cuida los bienes artísticos que pertenecen al Estado.","Museos nacionales: el Prado y el Reina Sofía (Madrid). Otros muy conocidos: Museo Picasso (Barcelona), Thyssen-Bornemisza (Madrid) y Guggenheim (Bilbao).","Museo del Prado: Las meninas (Velázquez), San Francisco en oración (Zurbarán), Los fusilamientos del 3 de mayo y La maja desnuda (Goya).","Museo Reina Sofía: Guernica (Picasso), La verbena (Maruja Mallo), Figura en una ventana (Dalí), Madrid desde Capitán Haya (Antonio López).","Joaquín Sorolla: Paseo a la orilla del mar (Casa Museo Sorolla). Joan Miró: logotipo de Turespaña."],"ojo":["Mezquita = Córdoba; Alhambra = Granada.","El Guernica está en el Reina Sofía, no en el Prado ni en el Thyssen.","El Guggenheim está en Bilbao, no en Madrid.","La verbena es de Maruja Mallo, pintora; Carmen Maura y Clara Lago son actrices."],"tabla":{"cabecera":["Obra","Artista","Museo"],"filas":[["Las meninas","Velázquez","Prado"],["San Francisco en oración","Zurbarán","Prado"],["Los fusilamientos del 3 de mayo","Goya","Prado"],["La maja desnuda","Goya","Prado"],["Guernica","Picasso","Reina Sofía"],["La verbena","Maruja Mallo","Reina Sofía"],["Figura en una ventana","Dalí","Reina Sofía"],["Madrid desde Capitán Haya","Antonio López","Reina Sofía"],["Paseo a la orilla del mar","Sorolla","Casa Museo Sorolla"]]},"pags":[51,52,53,54,55]},{"id":"t4-gastronomia","tarea":4,"subtema":"Gastronomía (personajes)","titulo":"Cocineros famosos","puntos":["España tiene grandes cocineros de fama internacional.","Catalanes: Ferran Adrià, Carme Ruscalleda y los hermanos Roca.","Vascos: Juan Mari Arzak, Pedro Subijana y Martin Berasategui.","Asturiano: José Andrés.","Madrileños: David Muñoz y Paco Roncero.","Platos conocidos: paella, tortilla de patatas, churros, gazpacho y sangría."],"ojo":["Juan Mari Arzak es cocinero, no escritor ni músico."],"pags":[74,75]},{"id":"t4-historia","tarea":4,"subtema":"Historia","titulo":"Historia de España","puntos":["Edad Media: en Al-Ándalus, Córdoba fue un gran centro de cultura y ciencia (medicina, filosofía, matemáticas, astronomía).","1252: Alfonso X convierte a Toledo en referente cultural; Toledo es la ciudad de las tres culturas: judía, musulmana y cristiana.","1492: Colón llega a América, los Reyes Católicos conquistan Granada y se publica la primera gramática castellana.","1519: Magallanes y Elcano inician la primera vuelta al mundo.","Siglos XVI-XVII: Imperio español; Carlos I, primer rey de España, y Felipe II.","1705-1715: Guerra de Sucesión; gana Felipe V (Borbón). 1808-1814: Guerra de Independencia contra Francia.","1898: guerra de Cuba («desastre del 98»); España pierde Cuba, Puerto Rico, Filipinas y Guam.","1936-1939: Guerra Civil. 1939-1975: franquismo. 1975-1982: Transición (Adolfo Suárez, UCD).","1977: primeras elecciones democráticas. 6 de diciembre de 1978: referéndum de la Constitución (88 % a favor).","1986: entrada en la CEE. 1992: Olimpiadas de Barcelona, Expo de Sevilla y AVE. 2014: Felipe VI, rey.","Clara Campoamor (Generación de 1914) fue defensora de los derechos de la mujer."],"ojo":["Las tres culturas medievales son cristiana, judía y musulmana: no fenicia ni griega.","El centro científico de Al-Ándalus es Córdoba, no Madrid ni Barcelona.","Clara Campoamor no fue cantante ni directora de cine."],"tabla":{"cabecera":["Fecha","Acontecimiento"],"filas":[["1252","Alfonso X: Toledo, ciudad de las tres culturas"],["1492","Colón en América; conquista de Granada; primera gramática castellana"],["1519","Magallanes y Elcano: primera vuelta al mundo"],["1705-1715","Guerra de Sucesión (Felipe V)"],["1808-1814","Guerra de Independencia"],["1898","Desastre del 98"],["1936-1939","Guerra Civil"],["1939-1975","Franquismo"],["1975-1982","Transición"],["1978","Referéndum de la Constitución (6 de diciembre)"],["1986","Entrada en la CEE (1 de enero)"],["1992","Olimpiadas de Barcelona y Expo de Sevilla"],["2014","Felipe VI, rey"]]},"pags":[47,56,57,58,59]},{"id":"t4-deporte","tarea":4,"subtema":"Deporte","titulo":"Deporte","puntos":["Son muy importantes los campeonatos de Liga y de Copa del Rey de fútbol y baloncesto y la Vuelta ciclista a España.","Tenis: Rafael Nadal y Carlos Alcaraz.","Baloncesto: Pau y Marc Gasol.","Automovilismo: Carlos Sainz. Motociclismo: Marc Márquez. Ciclismo: Miguel Induráin.","Montañismo: Edurne Pasaban. Natación: Mireia Belmonte y Gemma Mengual. Bádminton: Carolina Marín. Halterofilia: Lydia Valentín.","También destacan las selecciones nacionales masculinas y femeninas de fútbol y baloncesto.","Paralímpicos en París 2024: Teresa Perales (natación, 28 medallas según el manual), Ricardo Ten y Sergio Garrote (ciclismo), Susana Rodríguez y Daniel Molina (triatlón)."],"ojo":["Alcaraz juega al tenis; Pau Gasol, al baloncesto; Carlos Sainz conduce coches.","Teresa Perales y Daniel Molina son deportistas paralímpicos, no músicos ni actores.","La Liga y la Copa del Rey son de fútbol (y baloncesto), no de natación ni atletismo."],"pags":[65]},{"id":"t4-premios","tarea":4,"subtema":"Premios","titulo":"Premios y acontecimientos culturales","puntos":["Premios Princesa de Asturias: los da la Fundación Princesa de Asturias para promover valores científicos, culturales y humanísticos.","Premio Cervantes: el «Nobel de las letras hispanas»; premia la obra completa en español de un escritor español o hispanoamericano. El primero fue Jorge Guillén (1976).","Premio Nacional de las Letras Españolas: lo da el Ministerio de Cultura a un escritor español en cualquier lengua de España.","Premios Goya: los da la Academia de las Artes y las Ciencias Cinematográficas; premian a los mejores profesionales del cine.","Día del Libro: 23 de abril, fecha en que murieron Cervantes, Shakespeare y el Inca Garcilaso; hay ferias del libro en toda España.","Festivales de cine: San Sebastián, Sitges, Málaga y Valladolid. Teatro clásico: Almagro, Mérida y el Teatre Grec de Barcelona. ARCO: arte contemporáneo en Madrid desde 1981.","Premios Nobel españoles: Literatura (Echegaray, Benavente, Juan Ramón Jiménez, Aleixandre, Cela, Vargas Llosa) y Medicina (Ramón y Cajal, Severo Ochoa)."],"ojo":["Cervantes = escritores; Goya = cine; Princesa de Asturias = ciencia, cultura y humanidades.","El Nobel no es un premio español: es internacional."],"tabla":{"cabecera":["Año","Premio Nobel","Especialidad"],"filas":[["1904","José Echegaray","Literatura"],["1906","Santiago Ramón y Cajal","Fisiología y Medicina"],["1922","Jacinto Benavente","Literatura"],["1956","Juan Ramón Jiménez","Literatura"],["1959","Severo Ochoa","Fisiología y Medicina"],["1977","Vicente Aleixandre","Literatura"],["1989","Camilo José Cela","Literatura"],["2010","Mario Vargas Llosa","Literatura"]]},"pags":[63,64]},{"id":"t5-documentos","tarea":5,"subtema":"Documentos y trámites personales","titulo":"Documentos y trámites personales","puntos":["Nombre (simple o compuesto) y dos apellidos: normalmente el 1.º del padre y el 2.º de la madre, pero los padres pueden invertir el orden.","DNI: obligatorio para los españoles mayores de 14 años; su número con letra sirve también como NIF.","TIE (Tarjeta de Identidad de Extranjero): la tarjeta de residencia que deben tramitar los extranjeros que quieren vivir en España.","Pasaporte: para viajar a países que no son de la UE ni del espacio Schengen (por ejemplo, China).","DNI, TIE y pasaporte se hacen en persona en la comisaría de policía (Ministerio del Interior).","Certificado de empadronamiento: demuestra dónde vives; lo expide el Ayuntamiento.","Libro de familia: se tramitaba en el Registro Civil; desde el 1 de mayo de 2021 convive con el registro electrónico individual, que lo sustituye.","Registro Civil (Ministerio de Justicia): nacimientos, matrimonios, divorcios, certificado de nacimiento y trámites de nacionalidad.","En los documentos oficiales aparecen: nombre y apellidos, DNI (o NIE/pasaporte para extranjeros), sexo, domicilio, lugar y fecha de nacimiento.","Residencia exigida para pedir la nacionalidad: 10 años (general), 5 (refugiados), 2 (iberoamericanos, Andorra, Filipinas, Guinea Ecuatorial, Portugal, sefardíes), 1 (casos especiales, como nacidos en España o casados con español)."],"ojo":["El pasaporte NO se hace en el Registro Civil ni en el Ayuntamiento, sino en la comisaría.","El DNI es solo para españoles; los extranjeros tienen TIE y NIE.","El empadronamiento es en el Ayuntamiento, no en la comisaría.","Primer apellido: la respuesta correcta es «puede ser el de la madre o el del padre», no «obligatoriamente el del padre».","El registro electrónico individual sustituye al libro de familia, no al DNI."],"tabla":{"cabecera":["Documento","Para qué sirve","Dónde se tramita"],"filas":[["DNI","Identidad de los españoles (desde los 14 años)","Comisaría de policía"],["TIE","Residencia legal de los extranjeros","Comisaría de policía"],["Pasaporte","Viajar fuera de la UE y de Schengen","Comisaría de policía"],["Certificado de empadronamiento","Demostrar dónde vives","Ayuntamiento"],["Libro de familia / registro electrónico","Datos de nacimiento, matrimonio, hijos","Registro Civil"],["Certificado de nacimiento","Cuándo y dónde naciste","Registro Civil"],["Tarjeta sanitaria","Atención en la sanidad pública","Centro de salud"],["Carné de conducir","Conducir legalmente","DGT"],["Número de la Seguridad Social","Trabajar y cotizar","Tesorería General de la Seguridad Social"]]},"pags":[70,71,72]},{"id":"t5-trafico","tarea":5,"subtema":"Tráfico y vehículos","titulo":"Tráfico y vehículos","puntos":["Carné de conducir: para mayores de 18 años.","Para obtenerlo: examen teórico + examen práctico, informe de aptitud psicofísica, DNI o pasaporte y una foto.","Lo examina y expide la Dirección General de Tráfico (DGT).","Velocidad máxima: 120 km/h en autopista y autovía; 90 km/h en carretera convencional; 20, 30 o 50 km/h en ciudad.","Alcohol: límite de 0,5 g/l en sangre.","Cinturón de seguridad obligatorio para todos los ocupantes; normas sobre la silla portabebés.","El propietario debe matricular el coche, tener el seguro al día, pasar la ITV y pagar los impuestos anuales.","ITV = Inspección Técnica de Vehículos: revisión obligatoria del coche.","No se puede dejar conducir a personas sin carné; si pierdes todos los puntos, te retiran el permiso.","La red de carreteras puede ser estatal, autonómica o local; hay autopistas de peaje y autovías."],"ojo":["ITV (vehículos) ≠ ITE (edificios) ≠ IBI (impuesto de casas y terrenos).","16 años = trabajar; 18 años = conducir y votar.","90 km/h es la carretera convencional, no la autopista (120).","El carné se hace en la DGT, no en la Policía ni en el Registro Civil.","Lo obligatorio es el seguro; el garaje y la alarma no lo son."],"tabla":{"cabecera":["Vía","Límite de velocidad"],"filas":[["Autopista y autovía","120 km/h"],["Carretera convencional","90 km/h"],["Ciudad","20, 30 o 50 km/h"]]},"pags":[71,87]},{"id":"t5-medios","tarea":5,"subtema":"Medios de comunicación","titulo":"Medios de comunicación","puntos":["Los medios tienen una función social: informan y ayudan a crear opinión.","Televisión pública estatal (RTVE): La 1 (generalista), La 2 (cultural), Clan (infantil), 24 horas (noticias) y Teledeporte (deportes).","Televisión privada: Atresmedia (Antena 3, laSexta, Neox, Nova, Mega, Atreseries) y Mediaset España (Telecinco, Cuatro, FDF, Boing, Divinity, Energy, Be Mad).","Televisiones autonómicas públicas: Canal Sur (Andalucía), ETB (País Vasco), Telemadrid (Madrid), TV3 (Cataluña), TVG (Galicia).","Prensa nacional: ABC, El Mundo, El País, La Razón, La Vanguardia.","Prensa regional: El Correo, La Voz de Galicia, El Periódico de Catalunya, El Diario Vasco.","Prensa deportiva: As, Marca, Mundo Deportivo. Prensa económica: Cinco Días, Expansión.","Radio: la pública es Radio Nacional; las privadas con más audiencia, Cadena SER, COPE y Onda Cero."],"ojo":["Telecinco (Tele 5) y Antena 3 son privadas aunque lleven número; La 1 y La 2 son públicas.","Noticias todo el día = Canal 24 horas, no La 1 ni Teledeporte.","Canal Sur es autonómico (Andalucía), no nacional.","El Diario Vasco y La Voz de Galicia son regionales; El País es nacional."],"tabla":{"cabecera":["Tipo","Ejemplos"],"filas":[["TV pública estatal (RTVE)","La 1, La 2, Clan, 24 horas, Teledeporte"],["TV privada","Antena 3, laSexta, Nova (Atresmedia); Telecinco, Cuatro (Mediaset)"],["TV autonómica pública","Canal Sur, ETB, Telemadrid, TV3, TVG"],["Prensa nacional","ABC, El Mundo, El País, La Razón, La Vanguardia"],["Prensa regional","El Correo, La Voz de Galicia, El Periódico de Catalunya, El Diario Vasco"],["Radio","Radio Nacional (pública); SER, COPE, Onda Cero (privadas)"]]},"pags":[83,84]},{"id":"t5-familia","tarea":5,"subtema":"Servicios sociales, familia e igualdad","titulo":"Servicios sociales, familia e igualdad","puntos":["El matrimonio puede ser civil o religioso; se permite entre personas del mismo sexo y de distinto sexo. Quien no quiere casarse puede registrarse como pareja de hecho.","El divorcio está permitido; se regulan la custodia de los hijos y la responsabilidad económica.","Familia monoparental: solo el padre o la madre con los hijos. Familia numerosa: tres hijos o más.","Permiso por nacimiento o adopción: 19 semanas para la madre y 19 para el padre (según el manual); también permiso de lactancia y reducción de jornada por hijos menores de 12 años.","Ayudas fiscales a las familias: desgravación por hijos en la declaración de la renta y descuentos (transporte, matrícula, guardería, comedor).","Ministerio de Derechos Sociales, Consumo y Agenda 2030 y Ministerio de Inclusión, Seguridad Social y Migraciones: integración social, familia, menores, dependencia y discapacidad.","Ministerio de Igualdad: lucha contra la discriminación y la violencia de género.","Seguridad Social: Ingreso Mínimo Vital y pensiones de viudedad, orfandad o incapacidad laboral permanente. IMSERSO: viajes para mayores.","ONG: Cáritas, Cruz Roja, AECC. La ONCE trabaja por la integración de las personas con discapacidad visual (Premio Príncipe de Asturias de la Concordia 2013).","016: teléfono gratuito para víctimas de violencia de género; 24 horas, 365 días; no deja rastro en la factura; 53 idiomas; también por WhatsApp (600 000 016) y correo; depende del Ministerio de Igualdad."],"ojo":["016 = violencia de género; 112 = emergencias; 060 = información de la Administración; 091 = Policía Nacional.","El 016 funciona las 24 horas, no solo por la mañana ni solo de lunes a viernes.","ONCE = discapacidad visual; Cáritas = ayuda social; Unicef = infancia (ONU).","Numerosa empieza en 3 hijos, no en 2.","El permiso es de 19 semanas (dato que puede cambiar): no confundir con los 12 años de la reducción de jornada."],"tabla":{"cabecera":["Teléfono","Para qué sirve"],"filas":[["112","Cualquier emergencia, en toda la UE (gratuito)"],["016","Víctimas de violencia de género (gratuito, 24 h)"],["060","Información de la Administración General del Estado"]]},"pags":[72,81,82,83]},{"id":"t5-vivienda","tarea":5,"subtema":"Vivienda y normas de convivencia","titulo":"Vivienda y normas de convivencia","puntos":["La vivienda más habitual es el piso en un edificio de viviendas; también hay viviendas unifamiliares (chalé, casa adosada).","Según el manual, cerca del 75 % de las viviendas son en propiedad y el 25 % en alquiler.","Alquiler: contrato con duración, precio y obligaciones; mínimo legal de 5 años (propietario persona física) o 7 (persona jurídica); fianza de normalmente una mensualidad.","Viviendas de protección oficial: precio limitado, subvencionadas por la Administración local o autonómica.","Comunidad de vecinos: pagar los gastos, no molestar con ruidos (sobre todo desde las 22:00), reciclar la basura y cuidar los espacios comunes.","Parques, jardines e instalaciones deportivas: respetar a las personas y el mobiliario, respetar los horarios, no comer ni beber si no está permitido.","No fumar en lugares públicos frente a un hospital o un centro educativo.","No pisar el césped ni arrancar flores (norma de parques y jardines).","Transporte público: respetar la fila, dejar salir antes de entrar, no hablar con el conductor, no fumar, respetar las normas de equipaje, ceder el asiento a mayores, personas con movilidad reducida y embarazadas, llevar el dinero justo en el autobús."],"ojo":["Césped y flores → parque; equipaje, billete y ceder el asiento → transporte público.","En la comunidad la norma oficial es «no molestar con ruido»; el manual habla de «cuidar» (no limpiar) los espacios comunes.","Delante de un colegio lo prohibido es fumar."],"pags":[73,74,86,87,88,89]},{"id":"t5-animales","tarea":5,"subtema":"Animales domésticos","titulo":"Animales domésticos","puntos":["Las mascotas más comunes son perros, gatos y pájaros; es preferible adoptar a comprar.","Es obligatorio registrarlos con un microchip electrónico, sobre todo perros y gatos.","Hay que vacunarlos y llevarlos a revisiones veterinarias periódicas.","Todos los perros necesitan un seguro de responsabilidad civil por daños a terceros.","En la calle: correa, bozal si hace falta y recoger siempre sus excrementos.","El registro de perros se hace en el Ayuntamiento (dato de la pregunta oficial; el manual no lo detalla)."],"ojo":["Los perros se registran en el Ayuntamiento, no en la comisaría ni en el Ministerio de Justicia.","Pasearlo sin correa o no recoger sus excrementos va contra las normas."],"pags":[74]},{"id":"t5-gastronomia","tarea":5,"subtema":"Gastronomía y productos","titulo":"Gastronomía y productos","puntos":["Paella: arroz con verduras, azafrán, pollo, marisco o carne.","Tortilla de patatas o tortilla española: huevos, patata y cebolla.","Gazpacho: tomate, pepino, pimiento, ajo y cebolla. Otros platos conocidos: churros y sangría.","Productos típicos: aceite de oliva, frutas y verduras, marisco y pescado, ibéricos (jamón, lomo, chorizo), turrón, mazapán, roscón de Reyes, torrijas; bebidas: vino, cava y sidra.","Denominaciones de origen: vinos de La Rioja, Ribera del Duero y Jerez; sidra de Asturias; cava de Cataluña; aceite de Andalucía y Castilla-La Mancha; ibéricos de Extremadura, Andalucía y Castilla y León.","El aperitivo que se toma en bares antes de comer se llama tapa, banderilla, pincho o ración.","En los bares y restaurantes: ración, plato combinado, menú del día (dos platos, pan, bebida y postre o café) o comer a la carta.","Grandes cocineros: Ferran Adrià, Carme Ruscalleda, hermanos Roca, Arzak, Subijana, Berasategui, José Andrés, David Muñoz, Paco Roncero."],"ojo":["Cava → Cataluña; sidra → Asturias; aceite → Andalucía (y Castilla-La Mancha); La Rioja → vino.","La pizza y la pasta son italianas.","El chorizo es un ibérico, no la base de la paella; la base es el arroz.","Tapa ≠ bocadillo ≠ primer plato."],"tabla":{"cabecera":["Producto","Región destacada"],"filas":[["Vino","La Rioja, Ribera del Duero, Jerez"],["Sidra","Principado de Asturias"],["Cava","Cataluña"],["Aceite de oliva","Andalucía y Castilla-La Mancha"],["Productos ibéricos","Extremadura, Andalucía, Castilla y León"]]},"pags":[74,75]},{"id":"t5-horarios","tarea":5,"subtema":"Horarios, calendario y costumbres","titulo":"Horarios, calendario y costumbres","puntos":["Comidas: desayuno de 7:30 a 8:30; comida de 14:00 a 15:30; cena de 21:00 a 22:00.","Calendario escolar: de septiembre a junio (cada comunidad fija las fechas).","Calendario laboral: de enero a diciembre, con 14 días festivos (nacionales, autonómicos y locales).","12 de octubre: Fiesta Nacional de España. 6 de diciembre: Día de la Constitución.","Otras fiestas: 1 de enero, 6 de enero (Reyes), Viernes Santo, 1 de mayo, 15 de agosto, 1 de noviembre, 8 de diciembre y 25 de diciembre.","Fiestas que las comunidades pueden cambiar: 19 de marzo, Jueves Santo, 25 de julio. Cada localidad tiene 2 fiestas propias.","Vacaciones habituales: Navidad (24 de diciembre al 6 de enero), Semana Santa y verano (julio y agosto).","Hora oficial: GMT/UTC +1 en invierno y +2 en verano; Canarias tiene una hora menos.","Tiendas: aproximadamente de 10:00 a 14:00 y de 17:00 a 20:00 de lunes a viernes, el sábado solo por la mañana y el domingo suelen cerrar. Hipermercados y centros comerciales: de 10:00 a 22:00 todos los días."],"ojo":["12 de octubre (Fiesta Nacional) ≠ 6 de diciembre (Constitución) ≠ 15 de agosto (Asunción).","Canarias: una hora MENOS, no más.","El día de cierre del pequeño comercio es el domingo."],"tabla":{"cabecera":["Fecha","Fiesta"],"filas":[["1 de enero","Año Nuevo"],["6 de enero","Día de Reyes"],["1 de mayo","Día del Trabajo"],["15 de agosto","Asunción de la Virgen"],["12 de octubre","Fiesta Nacional de España"],["1 de noviembre","Todos los Santos"],["6 de diciembre","Día de la Constitución"],["8 de diciembre","Inmaculada Concepción"],["25 de diciembre","Navidad"]]},"pags":[75,76,85]},{"id":"t5-educacion","tarea":5,"subtema":"Educación","titulo":"Educación","puntos":["La educación es obligatoria y gratuita de los 6 a los 16 años (educación básica), excepto libros y materiales. Ley actual: LOMLOE (2020).","Educación Infantil: no obligatoria; dos ciclos (0-3 y 3-6 años); el segundo es gratuito.","Primaria: 6 cursos, de 6 a 12 años. ESO: 4 cursos, de 12 a 16 años. Las dos son obligatorias.","Bachillerato: no obligatorio; 2 cursos, de 16 a 18 años; da acceso a la educación superior.","FP: básica (Título Profesional Básico), grado medio (título de Técnico) y grado superior (Técnico Superior).","Universidad: se entra con Bachillerato + PAU (Prueba de Acceso a la Universidad) o con un título de Técnico Superior.","Títulos universitarios: Grado (Graduado, unos 4 años, 240 créditos), Máster (1-2 años) y Doctorado (Doctor, tras la tesis doctoral).","Escuelas Oficiales de Idiomas: niveles del Marco Común Europeo; se entra con 16 años o más.","Centros públicos: laicos, gratuitos, financiados por la Administración, plazas limitadas con requisitos. Concertados: privados con subvención pública (la mayoría religiosos). Privados: pagados solo por los padres.","CEPA: para mayores de 18 años (sacar el título de ESO) y cursos de acceso a la universidad para mayores de 25 años.","Hay becas y ayudas (libros, comedor, transporte) y el Ministerio homologa títulos extranjeros."],"ojo":["Ni Infantil, ni Bachillerato, ni FP son obligatorios.","PAU es el nombre oficial; «Selectividad» es el nombre antiguo y popular.","Grado Medio → Técnico; Bachillerato → Bachiller; ESO → Graduado en ESO; tesis → Doctor.","Concertado = privado CON dinero público; privado = solo dinero de los padres.","18 años = CEPA para la ESO; 25 años = acceso a la universidad sin Bachillerato."],"tabla":{"cabecera":["Etapa","Edad","¿Obligatoria?","Título"],"filas":[["Infantil (2 ciclos)","0-6 años","No","—"],["Primaria (6 cursos)","6-12 años","Sí","—"],["ESO (4 cursos)","12-16 años","Sí","Graduado en ESO"],["Bachillerato (2 cursos)","16-18 años","No","Bachiller"],["FP Grado Medio (2 cursos)","Desde 16 años","No","Técnico"],["FP Grado Superior (2 años)","Desde 18 años","No","Técnico Superior"],["Universidad","Desde 18 años","No","Graduado, Máster, Doctor"]]},"pags":[76,77,78,79,80]},{"id":"t5-salud","tarea":5,"subtema":"Salud","titulo":"Salud","puntos":["La gestión sanitaria la comparten el Ministerio de Sanidad (coordina) y las comunidades autónomas (tienen la mayoría de competencias).","Centro de salud: atención primaria con médicos de familia, pediatras y enfermeros.","Centro de especialidades: profesionales para determinadas enfermedades o edades.","Hospital: ingresos, atención especializada y cirugía; también urgencias.","Tarjeta sanitaria: necesaria para la sanidad pública, las recetas y los especialistas; se tramita en el centro de salud de tu domicilio.","Cada persona tiene un médico de familia asignado al que se pide cita previa.","Tarjeta sanitaria europea: para otros países de la UE; vale 2 años.","Farmacias: venden medicinas con o sin receta y tienen servicio de guardia 24 horas.","España es líder mundial en donación de órganos desde hace 30 años; la Organización Nacional de Trasplantes ganó el Premio Príncipe de Asturias en 2010."],"ojo":["Médico de familia o pediatra → centro de salud, no hospital.","Medicinas → farmacia (el centro de salud receta, no vende).","La tarjeta sanitaria se pide en el centro de salud, no en la comisaría ni en el Ministerio.","Tarjeta sanitaria europea: 2 años, no 1 ni 10."],"pags":[71,80,81,86]},{"id":"t5-economia","tarea":5,"subtema":"Economía, trabajo e impuestos","titulo":"Economía, trabajo e impuestos","puntos":["Sectores por peso: 1.º servicios (terciario), 2.º industria y construcción (secundario), 3.º agricultura, pesca y ganadería (primario).","España destaca en turismo (3.er país del mundo en turistas, según la OMT 2017; 93,8 millones en 2023), infraestructuras, telecomunicaciones, ferrocarril, finanzas y textil.","Innovación: energías renovables, biotecnología, sector farmacéutico, transportes.","Importa: petróleo y derivados, componentes del automóvil, textiles y confección.","Exporta: automóviles, frutas y legumbres, vino, aceite, calzado, medicamentos; sobre todo a la Unión Europea.","Moneda: el euro desde 2002 (antes, la peseta).","Edad mínima para trabajar: 16 años.","Número de la Seguridad Social: se recibe al empezar a trabajar (Tesorería General de la Seguridad Social).","Informe de vida laboral: muestra la cotización y la trayectoria profesional.","La ley laboral más importante es el Estatuto de los Trabajadores.","Convenios colectivos: acuerdos entre la empresa y los sindicatos sobre las condiciones laborales.","Impuestos directos (renta y patrimonio: IRPF, Sociedades) e indirectos (consumo: IVA, Impuestos Especiales). Se pagan los dos tipos."],"ojo":["IVA = indirecto; IRPF = directo.","Calzado y medicamentos se exportan; petróleo, gas y ropa se importan.","16 para trabajar, 18 para conducir y votar.","El SEPE es un organismo, no una ley; la Constitución no es una ley laboral.","Las cifras de turismo, PIB y paro son «según el manual» y pueden cambiar."],"pags":[71,89,90,91]},{"id":"t5-transporte","tarea":5,"subtema":"Transporte","titulo":"Transporte","puntos":["Transporte urbano: metro, autobús, tranvía y taxi, más la red de trenes de cercanías, media y larga distancia.","Taxi libre: luz verde encendida o cartel de «Libre»; se toma en paradas o en la calle.","Compañías de tren: Renfe (pública: Cercanías, Media y Larga Distancia, AVE, mercancías), OUIGO e Iryo (privadas, alta velocidad), Captrain (mercancías).","Trenes de alta velocidad destacados: AVE, ALVIA y ALARIS.","Hay 48 aeropuertos públicos. Los más importantes: Adolfo Suárez Madrid-Barajas, Josep Tarradellas Barcelona-El Prat, Palma de Mallorca (Son Sant Joan) y Málaga (Pablo Picasso).","Puertos más importantes: Algeciras, Barcelona, Las Palmas, Bilbao, Valencia y Vigo.","Primeras ciudades con metro: Madrid, Barcelona, Valencia, Bilbao."],"ojo":["Adolfo Suárez = Madrid; Josep Tarradellas = Barcelona.","Tenerife y Alicante no están entre los puertos principales del manual; Algeciras sí.","Los tipos de tren son cercanías, media y larga distancia (no «rural» ni «transnacional»)."],"pags":[87,88,89]},{"id":"t5-comercio","tarea":5,"subtema":"Comercio, emergencias y servicios públicos","titulo":"Comercio, emergencias y servicios públicos","puntos":["Bibliotecas públicas: gratuitas para todos; préstamo de libros, ordenadores, wifi, sala de estudio. También hay museos y centros culturales.","Farmacias: medicinas con o sin receta; servicio de guardia las 24 horas.","Correos: envíos postales. Quiosco: periódicos y revistas. Mercados municipales: alimentos frescos. Supermercados: alimentación y limpieza. Librerías-papelerías: libros y material escolar.","Estanco: sellos y tabaco (dato de la pregunta oficial; el manual no lo menciona).","Consumidores: el artículo 51 de la Constitución los protege; garantía de 3 años para productos nuevos; Agencia Española de Consumo, Seguridad Alimentaria y Nutrición y Consejo de Consumidores.","112: teléfono gratuito para cualquier emergencia (sanitaria, incendio, salvamento, seguridad) en toda la UE.","La protección civil y las emergencias son responsabilidad de las comunidades autónomas y de la Administración central, además de las Fuerzas y Cuerpos de Seguridad.","El Camino de Santiago es Patrimonio de la Humanidad: una de las grandes rutas de peregrinación de Europa."],"ojo":["Sellos y tabaco → estanco; periódicos → quiosco; medicinas → farmacia.","112 = emergencias; 060 = información de la Administración; 911 no es el número de España.","Bibliotecas: gratis para todos, no solo para niños o parados."],"tabla":{"cabecera":["Establecimiento","Qué encuentras"],"filas":[["Farmacia","Medicinas con o sin receta (guardia 24 h)"],["Estanco","Sellos y tabaco"],["Quiosco","Periódicos y revistas"],["Correos","Envíos postales"],["Mercado municipal","Alimentos frescos"],["Supermercado","Alimentación y limpieza"],["Librería-papelería","Libros y material escolar"]]},"pags":[52,80,82,85,86]}]}</script>
<script>
'use strict';
/* Camino CCSE — app de estudio de la prueba CCSE 2026 (un solo archivo, sin dependencias). */

// ============================================================ Datos
const D = JSON.parse(document.getElementById('data').textContent);
const Q = Object.create(null);
D.questions.forEach(q => { Q[q.id] = q; });
const TAREAS = D.tareas;                 // {"1": {nombre, corto, cupo}}
const ORDEN_SUB = D.subtemas;            // {"1": [subtema...]}
const FICHAS = Object.create(null);
const FICHA_SUB = Object.create(null);
(D.fichas || []).forEach(f => { FICHAS[f.id] = f; FICHA_SUB[f.subtema] = f; });
const TOTAL = D.questions.length;
const IDS_T = t => D.questions.filter(q => q.tarea === t).map(q => q.id);

// ============================================================ Esquemas (diagramas de relaciones)
/* ESQUEMAS-INICIO
   Cada esquema tiene nodos (cajas que se pueden tocar) y bloques que los dibujan:
   - org: organigrama por filas; una fila es una lista de nodos o {cols:[{tit, tono, items}]}
          (en items, '>' delante del id = depende del anterior; una fila que empieza por '|' va aparte, sin línea).
   - flujo: pasos de arriba abajo; un paso puede ser una lista de alternativas.
   - grupos: tarjetas con un nodo de cabecera y una lista de datos.
   - linea: línea temporal [fecha, nodo].
   rels: [de, a, frase] = quién depende de quién, quién elige a quién...
   kw: expresiones (sin tildes, en minúsculas) que enlazan las preguntas con cada nodo.
   tono: a azul, v verde, m morado, n naranja, o oro, g gris. */
const ESQUEMAS = [
  {
    id: 'poderes', titulo: 'Los poderes del Estado', corto: 'Poderes del Estado', tarea: 1,
    subtemas: ['Constitución, valores y forma de Estado', 'La Corona', 'Gobierno y presidentes', 'Cortes Generales y leyes', 'Poder judicial y órganos de control', 'Organismos públicos', 'Justicia'],
    intro: 'Quién manda, quién elige a quién y de quién depende cada institución.',
    clave: [
      'Arriba de todo está la Constitución, y la soberanía es del pueblo: de él salen todos los poderes.',
      'El rey es el jefe del Estado: representa a España, arbitra y modera, pero no gobierna (monarquía parlamentaria).',
      'Debajo hay tres poderes separados y al mismo nivel: legislativo (Cortes), ejecutivo (Gobierno) y judicial (jueces).',
      'El presidente del Gobierno depende del Congreso: el Congreso lo elige y lo controla.',
      'El Tribunal Constitucional va aparte: interpreta la Constitución y no depende de ningún poder.',
    ],
    nodos: {
      pueblo: { t: 'Pueblo español', s: 'Soberanía nacional', tono: 'n', d: 'La soberanía nacional reside en el pueblo español: de él salen todos los poderes del Estado. Vota a sus representantes.', kw: [/pueblo espanol/, /soberania/] },
      constitucion: { t: 'Constitución de 1978', s: 'La ley de leyes', tono: 'n', d: 'Ley fundamental de España, aprobada en referéndum el 6 de diciembre de 1978. España es un Estado social y democrático de Derecho y una monarquía parlamentaria. Valores superiores: libertad, justicia, igualdad y pluralismo político.', kw: [/\bconstitucion\b/, /ley fundamental/, /ley de leyes/, /referendum/, /valores superiores/, /monarquia parlamentaria/, /estado social/, /separacion de poderes/, /pluralismo/] },
      rey: { t: 'El rey', s: 'Jefe del Estado · La Corona', tono: 'o', d: 'Felipe VI, rey desde 2014. Máxima representación del Estado y símbolo de su unidad. Arbitra y modera el funcionamiento de las instituciones, pero no gobierna. Vive en el Palacio de la Zarzuela; su residencia oficial es el Palacio Real. Heredero o heredera: Príncipe o Princesa de Asturias.', kw: [/\brey\b/, /\breina\b/, /corona/, /jefe del estado/, /zarzuela/, /palacio real/, /felipe vi\b/, /juan carlos/, /princes[ao] de asturias/, /modera/, /hereditari/, /reinar/] },
      cortes: { t: 'Cortes Generales', s: 'El Parlamento', d: 'Representan al pueblo español. Hacen y aprueban las leyes y los Presupuestos Generales del Estado y controlan al Gobierno. Tienen dos cámaras.', kw: [/cortes generales/, /parlamento/, /legislativ/, /presupuestos/] },
      congreso: { t: 'Congreso de los Diputados', s: '350 diputados', d: 'Diputados elegidos por provincias. Aquí se vota la investidura del presidente del Gobierno y se debaten las cuestiones de confianza y las mociones de censura. Su presidente es la tercera autoridad del Estado.', kw: [/congreso/, /\bdiputad/, /investidura/, /mocion de censura/, /cuestion de confianza/, /tercera autoridad/, /\b350\b/] },
      senado: { t: 'Senado', s: '265 senadores', d: 'Cámara de representación territorial. La mayoría de los senadores los eligen los ciudadanos y el resto, las comunidades autónomas.', kw: [/senado/, /senador/, /representacion territorial/] },
      defensor: { t: 'Defensor del Pueblo', s: 'Depende de las Cortes', d: 'Atiende las quejas de cualquier persona, española o extranjera, por el mal funcionamiento de las administraciones. Es gratis. Lo eligen el Congreso y el Senado para 5 años.', kw: [/defensor del pueblo/, /queja/] },

const ESQ_PREG = Object.create(null);   // esquema -> [ids]
function indexarEsquemas() {
  for (const q of D.questions) {
    const txt = normaliza(q.q + ' ' + q.opts[q.ans]);
    const res = [];
    for (const e of ESQUEMAS) {
      if (!e.subtemas.includes(q.subtema)) continue;
      const nodos = Object.keys(e.nodos).filter(n => (e.nodos[n].kw || []).some(r => r.test(txt)));
      res.push({ e: e.id, nodos, propio: e.subtemas[0] === q.subtema });
      (ESQ_PREG[e.id] = ESQ_PREG[e.id] || []).push(q.id);
      nodos.forEach(n => { const k = e.id + '/' + n; (NODO_PREG[k] = NODO_PREG[k] || []).push(q.id); });
    }
    // Primero los esquemas donde la pregunta encaja en más nodos; a igualdad, el esquema principal del subtema
    res.forEach(r => { r.peso = r.nodos.length * 2 + (r.propio ? 1 : 0); });
    res.sort((a, b) => b.peso - a.peso);
    PREG_ESQ[q.id] = res;
  }
}

function esquemasDePregunta(id) {

}
