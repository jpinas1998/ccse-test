:root {
  --azul: #1D4F91;
  --azul-hondo: #143A6B;
  --amarillo: #F2C230;
  --amarillo-suave: #FFF3C4;
  --piedra: #EEF0EC;
  --piedra-2: #DFE3DC;
  --superficie: #FFFFFF;
  --tinta: #1A2333;
  --tinta-2: #4A5568;
  --tinta-3: #6B7585;
  --linea: #CBD2CA;
  --verde: #1E7A4C;
  --verde-fondo: #E3F3EA;
  --rojo: #C2362B;
  --rojo-fondo: #FBE7E4;
  --morado: #6B3FA0;
  --naranja: #B4531A;
  --foco: #1D4F91;
  --sombra: 0 1px 2px rgba(20, 40, 70, .08), 0 4px 14px rgba(20, 40, 70, .06);
  --radio: 14px;
  --fs: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --azul: #6FA3E8;
    --azul-hondo: #9CC0F0;
    --amarillo: #F2C230;
    --amarillo-suave: #3A3216;
    --piedra: #0E1A2C;
    --piedra-2: #1A2940;
    --superficie: #15243A;
    --tinta: #EEF2F8;
    --tinta-2: #C3CCDA;
    --tinta-3: #94A0B4;
    --linea: #2C3D58;
    --verde: #58C78E;
    --verde-fondo: #12352A;
    --rojo: #F2877C;
    --rojo-fondo: #3D1E1E;
  --morado: #C3A3EE;
  --naranja: #F0A36B;
    --foco: #F2C230;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --azul: #6FA3E8;
  --azul-hondo: #9CC0F0;
  --amarillo: #F2C230;
  --amarillo-suave: #3A3216;
  --piedra: #0E1A2C;
  --piedra-2: #1A2940;
  --superficie: #15243A;
  --tinta: #EEF2F8;
  --tinta-2: #C3CCDA;
  --tinta-3: #94A0B4;
  --linea: #2C3D58;
  --verde: #58C78E;
  --verde-fondo: #12352A;
  --rojo: #F2877C;
  --rojo-fondo: #3D1E1E;
  --morado: #C3A3EE;
  --naranja: #F0A36B;
  --foco: #F2C230;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--piedra);
  color: var(--tinta);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: calc(17px * var(--fs));
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
body.en-sesion { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 6px; }
a { color: var(--azul); }
h1, h2, h3 { line-height: 1.2; margin: 0; }
p { margin: 0; }
.oculto { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.pagina { max-width: 680px; margin: 0 auto; padding: 16px 16px 24px; }

/* ---------- Cabecera de la home: el camino hacia la meta ---------- */
.meta {
  background: var(--azul-hondo);
  color: #fff;
  border-radius: 0 0 22px 22px;
  margin: -16px -16px 20px;
  padding: 22px 20px 20px;
}
:root[data-theme="dark"] .meta { background: #0A1424; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .meta { background: #0A1424; } }
.meta-marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
.meta-marca svg { flex: none; }
.meta-cifra { margin-top: 18px; font-size: 2.6rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.meta-texto { margin-top: 6px; color: #D7E3F5; font-size: 1rem; }
.senda { position: relative; height: 26px; margin-top: 16px; }
.senda-base { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 10px, transparent 10px 18px); }
.senda-hecho { position: absolute; left: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--amarillo); }
.senda-flecha { position: absolute; top: 0; transform: translateX(-50%); width: 26px; height: 26px; }
.senda-fin { position: absolute; right: -2px; top: 3px; width: 20px; height: 20px; }
.meta-datos { display: flex; gap: 18px; margin-top: 14px; font-size: .92rem; color: #D7E3F5; flex-wrap: wrap; }
.meta-datos b { color: #fff; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px; border-radius: 12px; border: 0;
  background: var(--azul); color: #fff; font-weight: 700; text-decoration: none;
}
:root[data-theme="dark"] .btn { color: #0E1A2C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0E1A2C; } }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-amarillo { background: var(--amarillo); color: #1A2333 !important; }
.btn-sec { background: transparent; color: var(--azul) !important; box-shadow: inset 0 0 0 2px var(--azul); }
.btn-texto { display: inline-flex; align-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--azul) !important; font-weight: 700; padding: 8px 10px; min-height: 44px; }
.btn-ancho { width: 100%; }
.fila-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.fila-btns > .btn { flex: 1 1 140px; }

/* ---------- Mapa del Camino ---------- */
.etapa { margin-bottom: 28px; }
.etapa-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.etapa-num { color: var(--tinta-3); font-size: .9rem; }
.etapa-nombre { font-size: 1.3rem; font-weight: 700; }
.etapa-cuenta { color: var(--tinta-2); font-size: .9rem; white-space: nowrap; }
.etapa.bloqueada .etapa-nombre { color: var(--tinta-3); }
.barra { height: 6px; background: var(--piedra-2); border-radius: 3px; overflow: hidden; margin: 8px 0 14px; }

.tramo { list-style: none; margin: 0; padding: 0; position: relative; }

.hito { position: relative; display: flex; align-items: center; gap: 14px; padding: 6px 0; }
.hito-btn { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; padding: 4px 6px 4px 0; border-radius: 12px; }

.mojon {
  position: relative; z-index: 1; flex: none; width: 52px; height: 58px;
  border-radius: 18px 18px 6px 6px; display: grid; place-items: center;
  background: var(--piedra-2); color: var(--tinta-3); font-weight: 700; font-size: 1.1rem;
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.08);
}
.hito.hecho .mojon { background: var(--superficie); color: var(--azul); box-shadow: inset 0 -5px 0 rgba(0,0,0,.06), 0 0 0 2px var(--linea); }
.hito.actual .mojon { background: var(--azul); color: var(--amarillo); box-shadow: 0 0 0 4px var(--amarillo-suave), inset 0 -5px 0 rgba(0,0,0,.2); }
.hito.actual .mojon svg { width: 30px; height: 30px; }
.hito-info { min-width: 0; }
.hito-tit { font-weight: 700; display: block; }
.hito-sub { color: var(--tinta-2); font-size: .9rem; display: block; }
.hito.bloqueado .hito-tit, .hito.bloqueado .hito-sub { color: var(--tinta-3); }
.estrellas { color: var(--amarillo); letter-spacing: 2px; font-size: 1rem; }
.estrellas .apagada { color: var(--linea); }
.hito.control .mojon { border-radius: 50%; width: 52px; height: 52px; background: var(--amarillo-suave); color: var(--tinta); font-size: 1.3rem; }
.ruta-final { display: flex; align-items: center; gap: 12px; color: var(--tinta-2); margin: 10px 0 0; padding-left: 4px; }

/* ---------- Tarjetas y listas ---------- */
.tarjeta { background: var(--superficie); border-radius: var(--radio); padding: 18px; box-shadow: var(--sombra); margin-bottom: 14px; }
.tarjeta h2 { font-size: 1.2rem; margin-bottom: 8px; }
.tarjeta p + p { margin-top: 8px; }
.tit-pagina { font-size: 1.6rem; margin: 6px 0 6px; }
.intro { color: var(--tinta-2); margin-bottom: 18px; }
.lista { list-style: none; margin: 0; padding: 0; }
.lista > li + li { border-top: 1px solid var(--linea); }
.fila { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 4px; background: none; border: 0; text-align: left; min-height: 52px; }
.fila .crece { flex: 1; min-width: 0; }
.fila .peq { color: var(--tinta-2); font-size: .88rem; }

.leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--tinta-2); margin: 4px 0 14px; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Pantalla de pregunta ---------- */
.sesion-cab { position: sticky; top: 0; z-index: 5; background: var(--piedra); padding: 10px 0 8px; margin: -16px 0 8px; }
.sesion-fila { display: flex; align-items: center; gap: 8px; }
.sesion-tit { flex: 1; min-width: 0; font-size: .95rem; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--piedra-2); display: grid; place-items: center; flex: none; }
.progreso-sesion { display: flex; gap: 4px; margin-top: 8px; }
.progreso-sesion i { flex: 1; height: 6px; border-radius: 3px; background: var(--piedra-2); }

.progreso-sesion i.ko { background: var(--rojo); }
.progreso-sesion i.ya { background: var(--amarillo); }
.marcador { display: flex; gap: 14px; font-size: .9rem; color: var(--tinta-2); margin-top: 6px; flex-wrap: wrap; }
.marcador b { color: var(--tinta); }
.reloj { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--tinta); }
.reloj.poco { color: var(--rojo); }

.pregunta-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 10px; color: var(--tinta-2); font-size: .88rem; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--piedra-2); color: var(--tinta-2); font-size: .82rem; }
.chip.nueva { background: var(--amarillo-suave); color: var(--tinta); }
.chip.repite { background: var(--rojo-fondo); color: var(--rojo); }
.enunciado { font-size: 1.32rem; font-weight: 700; line-height: 1.35; margin-bottom: 18px; }
.opciones { display: grid; gap: 10px; }
.opcion {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  background: var(--superficie); border: 2px solid var(--linea); border-radius: 14px;
  padding: 14px 14px; min-height: 58px; font-size: 1.05rem;
}
.opcion .letra { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--piedra-2); font-weight: 700; font-size: .95rem; }
.opcion .txt { padding-top: 2px; flex: 1; }
.opcion .marca { flex: none; width: 26px; height: 26px; margin-top: 2px; }
.opcion[aria-checked="true"] { border-color: var(--azul); box-shadow: 0 0 0 2px var(--azul) inset; }

.opciones.vf { grid-template-columns: 1fr 1fr; }
.opciones.vf .opcion { justify-content: center; font-weight: 700; }

.barra-accion {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--superficie); border-top: 1px solid var(--linea);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}

.barra-accion .btn { flex: 1; }

/* ---------- Explicación ---------- */
.explica { margin-top: 18px; border-radius: var(--radio); padding: 18px; background: var(--superficie); border-left: 6px solid var(--verde); box-shadow: var(--sombra); }

.explica-tit.ko { color: var(--rojo); }

.elegiste { background: var(--rojo-fondo); border-radius: 10px; padding: 10px 12px; }
.correcta-txt { background: var(--verde-fondo); border-radius: 10px; padding: 10px 12px; }

.truco svg { flex: none; margin-top: 2px; }
.nota { font-size: .85rem; color: var(--tinta-2); }
.hermana { padding: 10px 12px; border-radius: 10px; background: var(--piedra); margin-top: 8px; }
.hermana .r { color: var(--verde); font-weight: 700; }
.otras { margin: 6px 0 0; padding-left: 20px; }
.otras li + li { margin-top: 4px; }
details.mas-info summary { cursor: pointer; color: var(--azul); font-weight: 700; padding: 6px 0; min-height: 44px; display: flex; align-items: center; }

/* ---------- Resumen / resultado ---------- */
.resultado-cab { text-align: center; padding: 26px 16px 18px; }
.resultado-cab .grande { font-size: 3rem; font-weight: 700; line-height: 1; }
.resultado-cab .estrellas { font-size: 2.2rem; letter-spacing: 6px; }
.veredicto { display: inline-block; margin-top: 10px; padding: 6px 18px; border-radius: 999px; font-weight: 700; font-size: 1.1rem; }
.veredicto.apto { background: var(--verde-fondo); color: var(--verde); }
.veredicto.noapto { background: var(--rojo-fondo); color: var(--rojo); }
.tabla { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tabla th, .tabla td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: top; }
.tabla th { color: var(--tinta-2); font-weight: 700; font-size: .85rem; }
.tabla td.num, .tabla th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabla-scroll { overflow-x: auto; }

/* ---------- Simulacro ---------- */
.modos { display: grid; gap: 10px; }
.modo { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; padding: 16px; border-radius: var(--radio); border: 2px solid var(--linea); background: var(--superficie); }
.modo[aria-pressed="true"] { border-color: var(--azul); box-shadow: 0 0 0 2px var(--azul) inset; }
.modo b { display: block; font-size: 1.05rem; }
.modo span { color: var(--tinta-2); font-size: .92rem; }
.serie { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
.serie button { aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--linea); background: var(--superficie); font-weight: 700; display: grid; place-items: center; min-height: 44px; }
.serie button.hecho { background: var(--verde-fondo); border-color: var(--verde); color: var(--verde); }
.serie button[aria-pressed="true"] { border-color: var(--azul); box-shadow: 0 0 0 2px var(--azul) inset; }

/* ---------- Tabbar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center; background: var(--superficie); border-top: 1px solid var(--linea);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar[hidden] { display: none; }
.tab { flex: 1; max-width: 136px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 8px; background: none; border: 0; color: var(--tinta-3); font-size: .74rem; min-height: 60px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--azul); font-weight: 700; }

/* ---------- Modal ---------- */
.velo { position: fixed; inset: 0; z-index: 50; background: rgba(10, 20, 36, .55); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .velo { align-items: center; } }
.dialogo { background: var(--piedra); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .dialogo { border-radius: 22px; } }
@media (prefers-reduced-motion: no-preference) {
  .dialogo { animation: subir .22s ease-out; }
  .explica { animation: aparecer .2s ease-out; }
}
@keyframes subir { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.dialogo-cab { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.dialogo-cab h2 { flex: 1; font-size: 1.3rem; }
.sorpresa { text-align: center; padding: 8px 4px; }
.sorpresa svg { margin: 0 auto 10px; display: block; }

.sorpresa p { color: var(--tinta-2); margin-bottom: 18px; }
.ficha-puntos { padding-left: 20px; margin: 0; }

.ojo { background: var(--rojo-fondo); border-radius: 12px; padding: 12px 14px; margin-top: 14px; }

.ojo ul { margin: 0; padding-left: 20px; }

.campo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; min-height: 52px; }

.seg { display: inline-flex; background: var(--piedra-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--superficie); font-weight: 700; box-shadow: var(--sombra); }
.buscar { width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--linea); background: var(--superficie); min-height: 48px; }
textarea.buscar { min-height: 120px; font-family: ui-monospace, monospace; font-size: .8rem; }
.aviso { background: var(--amarillo-suave); border-radius: 12px; padding: 12px 14px; font-size: .92rem; margin-bottom: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
  background: var(--tinta); color: var(--piedra); padding: 10px 18px; border-radius: 999px; font-size: .92rem; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.ver { opacity: 1; }

.vacio { text-align: center; color: var(--tinta-2); padding: 26px 10px; }
.vacio svg { margin-bottom: 8px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--superficie); border-radius: 12px; padding: 12px; box-shadow: var(--sombra); }
.stat b { display: block; font-size: 1.5rem; }
.stat span { color: var(--tinta-2); font-size: .82rem; }

/* ---------- Esquemas (diagramas) ---------- */
.tono-a { --c: var(--azul); } .tono-v { --c: var(--verde); } .tono-m { --c: var(--morado); }
.tono-n { --c: var(--naranja); } .tono-o { --c: #B08A12; } .tono-g { --c: var(--tinta-3); }
:root[data-theme="dark"] .tono-o { --c: var(--amarillo); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tono-o { --c: var(--amarillo); } }
.esq { --c: var(--tinta-3); margin: 6px 0 14px; }
.esq-bloque { background: var(--superficie); border-radius: var(--radio); box-shadow: var(--sombra); padding: 16px 10px; margin-bottom: 14px; }
.esq-bloque > h2 { font-size: 1.1rem; margin: 0 6px 12px; }
.nodo {
  --cf: color-mix(in srgb, var(--c) 13%, var(--superficie));
  display: block; width: 100%; text-align: center; border: 2px solid var(--c); background: var(--cf);
  border-radius: 12px; padding: 7px 8px; min-height: 44px; font-weight: 700; font-size: .9rem; line-height: 1.25;
  overflow-wrap: break-word; hyphens: auto; transition: opacity .15s, box-shadow .15s; position: relative;
}
.nodo small { display: block; font-weight: 400; color: var(--tinta-2); font-size: .78rem; margin-top: 2px; }
.nodo.sel { box-shadow: 0 0 0 3px var(--superficie), 0 0 0 6px var(--c); }
.nodo.preg::after { content: "★"; position: absolute; top: -9px; right: -6px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--amarillo); color: #1A2333; font-size: .75rem; line-height: 22px; text-align: center; }
.esq.con-sel .nodo:not(.sel):not(.rel):not(.preg) { opacity: .35; }
.esq-sep { margin: 14px 0 10px; border-top: 2px dashed var(--linea); }
.esq-cols.sin-padre { padding-top: 0; }
.esq-cols.sin-padre::before, .esq-cols.sin-padre > .esq-col::before { display: none; }
.tarjeta h2 svg { vertical-align: -4px; margin-right: 4px; }
.esq-fila { display: flex; gap: 8px; justify-content: center; }
.esq-fila > .nodo { flex: 1 1 0; max-width: 300px; }
.esq-con { width: 0; height: 18px; margin: 0 auto; border-left: 2px solid var(--linea); }
.esq-cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; position: relative; padding-top: 16px; }
.esq-cols::before { content: ""; position: absolute; top: 0; left: calc(50% / var(--n)); right: calc(50% / var(--n)); border-top: 2px solid var(--linea); }
.esq-col { position: relative; min-width: 0; }
.esq-col::before { content: ""; position: absolute; top: -16px; left: 50%; height: 16px; border-left: 2px solid var(--linea); }
.esq-col-tit { color: var(--c); font-weight: 700; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; text-align: center; margin: 0 0 6px; line-height: 1.2; }
.esq-arbol, .esq-arbol ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.esq-arbol ul { margin: 6px 0 0 7px; padding-left: 7px; border-left: 2px solid var(--linea); }
.esq-arbol ul > li { position: relative; }
.esq-arbol ul > li::before { content: ""; position: absolute; left: -9px; top: 22px; width: 9px; border-top: 2px solid var(--linea); }
.esq-cols .nodo { font-size: .8rem; padding: 6px 5px; }
.esq-cols .nodo small { font-size: .72rem; }
.esq-flujo { display: grid; gap: 0; max-width: 460px; margin: 0 auto; }
.esq-paso { display: flex; gap: 8px; }
.esq-paso > .nodo { flex: 1 1 0; }
.esq-paso-o { align-self: center; color: var(--tinta-3); font-size: .8rem; flex: none; }
.esq-flecha { display: block; margin: 2px auto; color: var(--tinta-3); }
.esq-grupos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.esq-grupo { --cf: color-mix(in srgb, var(--c) 6%, var(--superficie)); border: 1px solid var(--linea); border-radius: 12px; padding: 6px; background: var(--cf); }
.esq-grupo ul { margin: 6px 0 2px; padding-left: 20px; font-size: .86rem; }
.esq-grupo li + li { margin-top: 2px; }
.esq-linea { list-style: none; margin: 0; padding: 0; position: relative; }
.esq-linea::before { content: ""; position: absolute; left: 76px; top: 10px; bottom: 10px; border-left: 2px solid var(--linea); }
.esq-hito { display: grid; grid-template-columns: 66px 1fr; gap: 20px; align-items: center; padding: 4px 0; position: relative; }
.esq-hito-f { text-align: right; font-weight: 700; font-size: .85rem; color: var(--tinta-2); font-variant-numeric: tabular-nums; line-height: 1.2; }
.esq-hito::before { content: ""; position: absolute; left: 72px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--linea); }
.esq-hito .nodo { text-align: left; }
.esq-clave { background: var(--amarillo-suave); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.esq-clave h2 { font-size: 1rem; margin-bottom: 6px; }
.esq-clave ul { margin: 0; padding-left: 20px; }
.esq-clave li + li { margin-top: 4px; }
.esq-pregunta { border-left: 4px solid var(--amarillo); background: var(--superficie); border-radius: 0 12px 12px 0; padding: 10px 12px; margin-bottom: 14px; font-size: .95rem; box-shadow: var(--sombra); }
.esq-panel { position: sticky; bottom: calc(68px + env(safe-area-inset-bottom)); z-index: 4; background: var(--superficie); border-top: 6px solid var(--c);
  border-radius: var(--radio); box-shadow: 0 -4px 22px rgba(10, 20, 36, .22); padding: 12px 14px; max-height: 40vh; overflow: auto; margin-bottom: 14px; font-size: .94rem; }
.dialogo .esq-panel { bottom: 0; }
.esq-panel-cab { display: flex; gap: 10px; align-items: flex-start; }
.esq-panel-cab h3 { flex: 1; font-size: 1.1rem; margin: 0; }
.esq-panel .btn-x { width: 36px; height: 36px; }
.esq-rels { list-style: none; margin: 8px 0 0; padding: 0; }
.esq-rels li { padding: 6px 0; border-top: 1px solid var(--linea); font-size: .92rem; }
.esq-rels .btn-texto { min-height: 32px; padding: 2px 6px; }
.esq-pista { text-align: center; color: var(--tinta-3); font-size: .85rem; margin: -4px 0 12px; }
.btn-esq { display: inline-flex; align-items: center; gap: 8px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media print { .tabbar, .barra-accion { display: none; } }

noma.","c":"La Delegación del Gobierno representa al Estado en la comunidad; no es una institución autonómica."},"truco":"Cada comunidad copia el esquema del Estado: parlamento (asamblea), gobierno (consejo de gobierno) y presidente.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1036","tarea":1,"subtema":"Lenguas e instituciones lingüísticas","tipo":"multiple","q":"¿Cuál de estas opciones es una lengua cooficial en alguna comunidad autónoma?","opts":{"a":"El gallego.","b":"El aragonés.","c":"El murciano."},"ans":"a","page":20,"nueva2026":false,"enModelos":1,"hermanas":["1032","1059"],"exp":{"why":"El gallego es lengua cooficial en Galicia. Las lenguas cooficiales son el gallego, el euskera, el catalán (con el valenciano) y el aranés.","cita":{"texto":"Además del castellano o español, se hablan otras lenguas oficiales en las siguientes comunidades autónomas: Galicia (gallego), Navarra y País Vasco (vasco o euskera), Cataluña (catalán y aranés), Islas Baleares (catalán), Comunidad Valenciana (catalán o valenciano).","pag":7},"distractores":{"b":"El aragonés se habla en zonas de Aragón, pero no es lengua cooficial.","c":"El murciano es una forma de hablar el castellano en Murcia, no una lengua oficial."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"1037","tarea":1,"subtema":"Lenguas e instituciones lingüísticas","tipo":"multiple","q":"¿Qué institución tiene como fin la promoción de la enseñanza de la lengua española y la difusión de la cultura en español?","opts":{"a":"El Instituto Nacional de Administración Pública.","b":"El Instituto Nacional de Estadística.","c":"El Instituto Cervantes."},"ans":"c","page":20,"nueva2026":false,"enModelos":0,"hermanas":["1038","1066"],"exp":{"why":"El Instituto Cervantes es el organismo que difunde y promociona la lengua española y la cultura en español en el mundo.","cita":{"texto":"Organismos para la difusión y promoción de las lenguas y las culturas Castellano o español Real Academia Española (RAE) Inst utivo = Gobierno; legislativo = diputados y senadores; judicial = jueces.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1053","tarea":1,"subtema":"La Corona","tipo":"multiple","q":"¿Dónde vive el rey?","opts":{"a":"En el Palacio de la Moneda.","b":"En el Palacio de la Zarzuela.","c":"En el Palacio de la Moncloa."},"ans":"b","page":22,"nueva2026":false,"enModelos":0,"hermanas":["1039"],"exp":{"why":"El rey vive en el Palacio de la Zarzuela. Su residencia oficial es el Palacio Real, pero no vive allí.","cita":{"texto":"El rey tiene su residencia oficial en el Palacio Real, pero vive en el Palacio de la Zarzuela.","pag":8},"distractores":{"a":"El Palacio de la Moneda está en Santiago de Chile: es la sede del presidente chileno.","c":"En el Palacio de la Moncloa vive el presidente del Gobierno."},"truco":"Rey → Zarzuela; presidente → Moncloa.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1054","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"El nombre oficial del parlamento español es…","opts":{"a":"Cortes Generales.","b":"Congreso de los Diputados.","c":"Senado."},"ans":"a","page":22,"nueva2026":false,"enModelos":0,"hermanas":["1016","1073","1100","1024"],"exp":{"why":"El nombre oficial del Parlamento español es Cortes Generales. El Congreso y el Senado son sus dos cámaras.","cita":{"texto":"Las Cortes Generales (nombre oficial del Parlamento español) representan al pueblo español y están formadas por dos cámaras: el Congreso de los Diputados y el Senado.","pag":9},"distractores":{"b":"El Congreso es solo una de las dos cámaras de las Cortes.","c":"El Senado es la otra cámara, la de representación territorial."},"truco":"Cortes Generales = Congreso + Senado.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1055","tarea":1,"subtema":"Organismos públicos","tipo":"multiple","q":"El Instituto de Comercio Exterior de España, el Instituto de las Mujeres y la Dirección General de Tráfico…","opts":{"a":"son organismos autónomos.","b":"dependen de ministerios.","c":"son organismos internacionales."},"ans":"b","page":22,"nueva2026":true,"enModelos":0,"hermanas":["1004"],"exp":{"why":"El ICEX, el Instituto de las Mujeres y la DGT son organismos que pertenecen a ministerios del Gobierno de España.","cita":{"texto":"Algunos ejemplos de organismos que pertenecen a ministerios de España son la Agencia Española de Meteorología (AEMET), la Agencia Tributaria (AEAT), la Dirección General de Tráfico (DGT)","pag":11},"distractores":{"a":"No funcionan por su cuenta: según el manual, pertenecen a ministerios.","c":"Son organismos españoles, no internacionales."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"1056","tarea":1,"subtema":"La Corona","tipo":"multiple","q":"¿Quién puede reinar en España?","opts":{"a":"Solo los hombres.","b":"Solo las mujeres.","c":"Tanto los hombres como las mujeres."},"ans":"c","page":22,"nueva2026":false,"enModelos":0,"hermanas":["1044"],"exp":{"why":"En España pueden reinar tanto hombres como mujeres; la Corona es hereditaria.","cita":{"texto":"En España se permite reinar tanto a hombres como a mujeres.","pag":8},"distractores":{"a":"Falso: las mujeres también pueden reinar.","b":"Falso: los hombres también pueden reinar."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"1057","tarea":1,"subtema":"Poder judicial y órganos de control","tipo":"multiple","q":"El Tribunal de Cuentas depende de…","opts":{"a":"la Presidencia del Gobierno.","b":"las Cortes Generales.","c":"el Ministerio de Hacienda."},"ans":"b","page":22,"nueva2026":false,"enModelos":0,"hermanas":["1065","1114","1087"],"exp":{"why":"El Tribunal de Cuentas, que controla las finanzas públicas y las cuentas de los partidos, depende de las Cortes Generales, igual que el Defensor del Pueblo.","cita":{"texto":"El Defensor del Pueblo y el Tribunal de Cuentas dependen de las Cortes Generales.","pag":12},"distractores":{"a":"No depende del Gobierno: así puede controlar sus cuentas con independencia.","c":"Del Ministerio de Hacienda depende la Agencia Tributaria, no el Tribunal de Cuentas."},"truco":"Defensor del Pueblo y Tribunal de Cuentas: los dos «vigilantes» dependen de las Cortes.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1058","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"¿Quién es la tercera autoridad del Estado, después del rey y el presidente del Gobierno?","opts":{"a":"El presidente del Senado.","b":"El ministro de Economía.","c":"El presidente del Congreso de los Diputados."},"ans":"c","page":22,"nueva2026":false,"enModelos":0,"hermanas":["1016"],"exp":{"why":"La tercera autoridad del Estado es el presidente del Congreso de los Diputados, después del rey y del presidente del Gobierno.","cita":{"texto":"El presidente del Congreso de los Diputados es la tercera autoridad del Estado español.","pag":9},"distractores":{"a":"El presidente del Senado es una autoridad importante, pero la tercera es el presidente del Congreso.","b":"El ministro de Economía es un miembro del Gobierno, no la tercera autoridad del Estado."},"truco":"Rey (1.º), presidente del Gobierno (2.º), presidente del Congreso (3.º).","fuera_manual":false,"sensible_tiempo":false}},{"id":"1059","tarea":1,"subtema":"Lenguas e instituciones lingüísticas","tipo":"multiple","q":"¿Qué lengua cooficial se habla en las Islas Baleares?","opts":{"a":"Gallego.","b":"Catalán.","c":"Euskera."},"ans":"b","page":22,"nueva2026":false,"enModelos":0,"hermanas":["1034","1036"],"exp":{"why":"En las Islas Baleares la lengua cooficial es el catalán.","cita":{"texto":"Además del castellano o español, se hablan otras lenguas oficiales en las siguientes comunidades autónomas: Galicia (gallego), Navarra y País Vasco (vasco o euskera), Cataluña (catalán y aranés), Islas Baleares (catalán), Comunidad Valenciana (catalán o valenciano).","pag":7},"distractores":{"a":"El gallego es cooficial en Galicia.","c":"El euskera es cooficial en el País Vasco y Navarra."},"truco":"El ca icante.","pag":15},"distractores":{"a":"Cádiz es una capital de provincia andaluza importante, pero no está entre las diez ciudades más pobladas.","c":"Albacete es una capital de provincia de Castilla-La Mancha, pero no está en la lista de las diez más pobladas."},"truco":"","fuera_manual":false,"sensible_tiempo":true}},{"id":"1068","tarea":1,"subtema":"Administración electrónica","tipo":"multiple","q":"¿Quién puede realizar trámites en línea ante la Administración Pública?","opts":{"a":"Jueces y magistrados.","b":"Cualquier ciudadano.","c":"Abogados colegiados."},"ans":"b","page":23,"nueva2026":true,"enModelos":0,"hermanas":["1090","1005","1017"],"exp":{"why":"Cualquier ciudadano puede hacer trámites por Internet con la Administración, por ejemplo pedir un certificado o pagar tasas. Solo necesita una identidad digital: DNI electrónico, certificado digital o Cl@ve.","cita":{"texto":"En España, muchos trámites con la Administración Pública (como pedir un certificado, pagar tasas, inscribirse en el padrón, solicitar ayudas, etc.) se pueden hacer por Internet sin necesidad de acudir físicamente a una oficina de la Administración.","pag":14},"distractores":{"a":"Los jueces y magistrados pueden hacer trámites, pero no son los únicos: la sede electrónica está abierta a todos.","c":"Los abogados colegiados también pueden, pero no hace falta ser abogado: cualquier ciudadano puede hacerlos."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"1069","tarea":1,"subtema":"La Corona","tipo":"multiple","q":"¿Cómo se llama el rey de España?","opts":{"a":"Juan Carlos I.","b":"Felipe VI.","c":"Alfonso XIII."},"ans":"b","page":23,"nueva2026":false,"enModelos":0,"hermanas":["1082","1045"],"exp":{"why":"Según el manual, el rey de España es Felipe VI. Fue proclamado rey el 19 de junio de 2014, cuando sucedió a su padre, Juan Carlos I.","cita":{"texto":"El 19 junio del año 2014, fue proclamado rey su hijo, Felipe VI.","pag":8},"distractores":{"a":"Juan Carlos I es el padre de Felipe VI; fue rey de 1975 a 2014.","c":"Alfonso XIII fue rey a principios del siglo XX, antes de la Segunda República."},"truco":"","fuera_manual":false,"sensible_tiempo":true}},{"id":"1070","tarea":1,"subtema":"Poder judicial y órganos de control","tipo":"multiple","q":"¿Cómo se llama el órgano de gobierno de los jueces y magistrados?","opts":{"a":"Tribunal Supremo.","b":"Consejo General del Poder Judicial.","c":"Consejo de Estado."},"ans":"b","page":23,"nueva2026":false,"enModelos":0,"hermanas":["1063","1014","2034"],"exp":{"why":"El Consejo General del Poder Judicial (CGPJ) es el órgano de gobierno de los jueces. Es autónomo y garantiza la independencia de jueces y tribunales.","cita":{"texto":"El Consejo General del Poder Judicial (CGPJ) es el órgano de gobierno de los jueces. Es un órgano autónomo y sirve para garantizar la independencia de los jueces y tribunales.","pag":10},"distractores":{"a":"El Tribunal Supremo es el tribunal más alto de España: juzga, pero no gobierna a los jueces.","c":"El Consejo de Estado es un órgano consultivo del Gobierno, no de los jueces."},"truco":"Si el nombre dice «Poder Judicial», es el que gobierna a los jueces: CGPJ.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1071","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"¿Quién aprueba los presupuestos generales del Estado?","opts":{"a":"Las Cortes Generales.","b":"El Tribunal de Cuentas.","c":"El Gobierno de España."},"ans":"a","page":23,"nueva2026":false,"enModelos":0,"hermanas":["1065","1074"],"exp":{"why":"Las Cortes Generales elaboran, debaten y aprueban las leyes y los Presupuestos generales del Estado. El Gobierno prepara el proyecto de presupuestos, pero quien lo aprueba es el Parlamento.","cita":{"texto":"Las funciones principales de las Cortes Generales son elaborar, debatir y aprobar las leyes y los Presupuestos generales del Estado y controlar la acción del Gobierno.","pag":9},"distractores":{"b":"El Tribunal de Cuentas controla después cómo se gasta el dinero público, pero no aprueba los presupuestos.","c":"El Gobierno presenta los presupuestos, pero no los aprueba: eso corresponde a las Cortes Generales."},"truco":"El Gobierno propone, las Cortes aprueban y el Tribunal de Cuentas controla.","fuera_manual":true,"sensible_tiempo":false}},{"id":"1072","tarea":1,"subtema":"Constitución, valores y forma de Estado","tipo":"multiple","q":"La Constitución española es…","opts":{"a":"la ley fundamental.","b":"parte de otra ley.","c":"una ley secundaria."},"ans":"a","page":23,"nueva2026":false,"enModelos":1,"hermanas":["1002"],"exp":{"why":"La Constitución es la ley fundamental de España, la «ley de leyes». Todo el sistema jurídico español se ordena a partir de ella.","cita":{"texto":"La Constitución es la «ley de leyes» o ley fundamental de España, a partir de la cual se establece el ordenamiento de todo el sistema jurídico español.","pag":6},"distractores":{"b":"La Constitución no forma parte de ninguna otra ley: es la ley principal y las demás dependen de ella.","c":"Es justo al revés: es la ley más importante; las otras leyes están por debajo de ella."},"truco":"Constitución = «ley de leyes»: la primera, la fundamental.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1073","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"Las Cortes Generales están compuestas por el Senado y…","opts":{"a":"el Congreso de los Diputados.","b":"el Tribunal Supremo.","c":"el Consejo de Estado."},"ans":"a","page":23,"nueva2026":false,"enModelos":1,"hermanas":["1100","1054","1120"],"exp":{"why":"Las Cortes Generales, el nombre oficial del Parlamento español, tienen dos cámaras: el Congreso de los Diputados y el Senado.","cita":{"texto":"Las Cortes Generales (nombre oficial del Parlamento español) representan al pueblo español y están formadas por dos cámaras: el Congreso de los Diputados y el Senado.","pag":9},"distractores":{"b":"El Tribunal Supremo forma parte del poder judicial, no del Parlamento.","c":"El Consejo de Estado es un órgano consultivo del Gobierno, no una cámara del Parlamento."},"truco":"Cortes = Congreso + Senado (dos cámaras).","fuera_manual":false,"sensible_tiempo":false}},{"id":"1074","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"¿Quién elabora las leyes?","opts":{"a":"El poder ejecutivo.","b":"El poder legislativo.","c":"El poder judicial."},"ans":"b","page":23,"nueva2026":false,"enModelos":0,"hermanas":["1099","1071","1009","1025"],"exp":{"why":"Las leyes las elabora el poder legislativo, es decir, las Cortes Generales (Congreso y Senado). Su función principal es elaborar, debatir y aprobar las leyes.","cita":{"texto":"Las funciones principales de las Cortes Generales son elaborar, debatir y aprobar las leyes y los Presupuestos generales del Estado y controlar la acción del Gobierno.","pag":9},"distractores":{"a":"El poder ejecutivo (el Gobierno) dirige la política y ejecuta las leyes; solo en casos urgentes dicta decretos ley.","c":"El poder judicial (jueces y magistrados) aplica las leyes y administra la justicia, no las hace."},"truco":"LEGISlativo viene de «lex, legis», que en latín significa ley: el que hace las leyes.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1075","tarea":1,"subtema":"Fuerzas Armadas y de Seguridad","tipo":"multiple","q":"La defensa de la integridad territorial de España corresponde a…","opts":{"a":"la Policía Nacional y la Guardia Civil.","b":"las Fuerzas Armadas.","c":"la Policía Nacional y las policías autonómicas."},"ans":"b","page":23,"nueva2026":false,"enModelos":0,"hermanas":["1040"],"exp":{"why":"La misión de las Fuerzas Armadas es garantizar la autoridad y la independencia de España, defender su integridad territorial y el orden constitucional.","cita":{"texto":"Las Fuerzas Armadas tienen como misión garantizar la autoridad y la independencia de España, defender su integridad territorial, además del orden constitucional.","pag":10},"distractores":{"a":"La Policía Na .","fuera_manual":false,"sensible_tiempo":false}},{"id":"1086","tarea":1,"subtema":"Fuerzas Armadas y de Seguridad","tipo":"multiple","q":"¿Quién vigila el tráfico en las carreteras?","opts":{"a":"La Guardia Civil.","b":"La Policía Nacional.","c":"El Ejército de Tierra."},"ans":"a","page":24,"nueva2026":false,"enModelos":0,"hermanas":["1077","1078","1083"],"exp":{"why":"La Guardia Civil vigila el tráfico en las vías interurbanas, es decir, en las carreteras entre pueblos y ciudades.","cita":{"texto":"Por su parte, la Guardia Civil tiene como funciones, entre otras, vigilar el tráfico en las vías públicas interurbanas, así como en puertos, aeropuertos, fronteras y costas.","pag":11},"distractores":{"b":"La Policía Nacional se ocupa del DNI, el pasaporte, la extranjería y el control de entrada y salida del país, no del tráfico en carretera.","c":"El Ejército de Tierra forma parte de las Fuerzas Armadas y defiende el país; no vigila el tráfico."},"truco":"Carretera = Guardia Civil (la «de Tráfico»); calle de la ciudad = Policía Local.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1087","tarea":1,"subtema":"Organismos públicos","tipo":"multiple","q":"¿Qué organismo se encarga de recaudar los impuestos?","opts":{"a":"El Tribunal de Cuentas.","b":"La Agencia Tributaria.","c":"El Consejo Económico y Social."},"ans":"b","page":24,"nueva2026":false,"enModelos":1,"hermanas":["1114","1057","5035"],"exp":{"why":"La Agencia Tributaria, que depende del Ministerio de Hacienda, recauda los impuestos. Con ese dinero se pagan los gastos públicos.","cita":{"texto":"La Agencia Tributaria, que depende del Ministerio de Hacienda y Función Pública, es la encargada de la recaudación de impuestos que contribuyen al sostenimiento de los gastos públicos.","pag":12},"distractores":{"a":"El Tribunal de Cuentas no cobra impuestos: controla las finanzas de las administraciones y las cuentas de los partidos.","c":"El Consejo Económico y Social es un órgano consultivo del Gobierno; da su opinión, pero no recauda impuestos."},"truco":"Tributo = impuesto: la Agencia TRIBUTaria cobra los tributos.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1088","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"¿Dónde se publican las leyes nacionales?","opts":{"a":"En el boletín del Instituto Nacional de Estadística (INE).","b":"En el Portal de la Administración Electrónica (PAe).","c":"En el Boletín Oficial del Estado (BOE)."},"ans":"c","page":24,"nueva2026":false,"enModelos":0,"hermanas":[],"exp":{"why":"Las leyes nacionales se publican en el Boletín Oficial del Estado (BOE). Cada comunidad autónoma tiene además su propio boletín.","cita":{"texto":"El Gobierno y las comunidades autónomas cuentan con diversos medios para comunicarse con los ciudadanos, entre ellos, el Boletín Oficial del Estado (BOE) y los diferentes boletines de las comunidades autónomas, que informan de las leyes, decretos, nombramientos, etc.","pag":14},"distractores":{"a":"El INE (Instituto Nacional de Estadística) publica estadísticas y datos de población, no leyes.","b":"El PAe es una web con información y servicios sobre la Administración electrónica, no el diario oficial de las leyes."},"truco":"BOE: Boletín Oficial del Estado, el «periódico» de las leyes.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1089","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"¿Cómo se llaman los órganos de gobierno que solo existen en Canarias?","opts":{"a":"Cabildos.","b":"Consejos insulares.","c":"Diputaciones."},"ans":"a","page":24,"nueva2026":false,"enModelos":1,"hermanas":["1022","1108","1107"],"exp":{"why":"En Canarias, en lugar de diputaciones, cada isla tiene un cabildo. Es un órgano propio de Canarias.","cita":{"texto":"En Canarias los órganos de gobierno son los cabildos y en Baleares son los consejos insulares.","pag":14},"distractores":{"b":"Los consejos insulares son los órganos de gobierno de las Islas Baleares, no de Canarias.","c":"Las diputaciones son el órgano de gobierno de las provincias en casi toda España; justamente no existen en Canarias ni en Baleares."},"truco":"Canarias - Cabildos (las dos con C); Baleares - consejos insulares.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1090","tarea":1,"subtema":"Administración electrónica","tipo":"multiple","q":"¿Cuál de estos trámites administrativos puede realizarse en la sede electrónica?","opts":{"a":"Tramitar el DNI.","b":"Renovar el pasaporte.","c":"Pagar los impuestos."},"ans":"c","page":24,"nueva2026":true,"enModelos":0,"hermanas":["1068","5028"],"exp":{"why":"En la sede electrónica de un ministerio u organismo se pueden pagar impuestos, presentar documentos o consultar expedientes sin ir a una oficina.","cita":{"texto":"Cada ministerio u organismo público tiene su propia sede electrónica, es decir, su web oficial, desde donde pueden realizarse trámites: presentar documentos, pagar impuestos, consultar expedientes, etc.","pag":14},"distractores":{"a":"El DNI se tramita en persona en una oficina de la Policía Nacional, porque hay que dar la foto y las huellas.","b":"El pasaporte también se renueva en persona en la Policía Nacional; no es un trámite de sede electrónica."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"1091","tarea":1,"subtema":"Administración electrónica","tipo":"multiple","q":"¿Cuál es el número de teléfono de información de la Administración General del Estado?","opts":{"a":"010.","b":"060.","c":"091."},"ans":"b","page":24,"nueva2026":false,"enModelos":0,"hermanas":["5052","5059"],"exp":{"why":"El 060 es el teléfono de información de la Administración General del Estado.","cita":{"texto":"Por otro lado, las distintas administraciones tienen sistemas de atención presencial, telefónica y electrónica, como el teléfono 060 (teléfono de información de la Administración General del Estado) y el Portal de la Administración Electrónica (PAe).","pag":14},"distractores":{"a":"El 010 es el teléfono de información de muchos ayuntamientos, no de la Administración del Estado.","c":"El 091 es el teléfono de la Policía Nacional."},"truco":"060 = información del Estado; 112 = emergencias; 091 = Policía Nacional.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1092","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"España está organizada en…","opts":{"a":"cantones.","b":"comunidades autónomas.","c":"estados federales."},"ans":"b","page":24,"nueva2026":false,"enModelos":0,"hermanas":["1117","1001","3013"],"exp":{"why":"Desde la Constitución de 1978, España se organiza en comunidades autónomas, provincias y municipios.","cita":{"texto":"En la Constitución de 1978 se establece que España se organiza a partir de ese momento en comunidades autónomas, provincias y municipios.","pag":12},"distractores":{"a":"Los cantones son la división territorial de Suiza, no de España.","c":"España no es un Estado federal; los «estados federales» son propios de países como Estados Unidos o Alemania."},"truco":"España por niveles: comunidades autónomas → provincias → municipios.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1093","tarea":1,"subtema":"Participación: elecciones, partidos, sindicatos","tipo":"multiple","q":"¿Cuántos partidos políticos hay en España?","opts":{"a":"Ninguno.","b":"Uno.","c":"Muchos."},"ans":"c","page":24,"nueva2026":false,"enModelos":1,"hermanas":["1043","2004"],"exp":{"why":"España tiene un sistema pluripartidista: hay muchos partidos y los ciudadanos pueden elegir entre diversas opciones políticas, a nivel nacional, autonómico y local.","cita":{"texto":"España tiene un sistema pluripartidista, es decir, los ciudadanos pueden elegir entre diversas opciones políticas o partidos, tanto en el ámbito nacional como en el autonómico o en el local.","pag":16},"distractores":{"a":"Una democracia necesita partidos políticos; la Constitución los menciona en su artículo 6.","b":"Un solo partido sería un sistema de partido único, propio de las dictaduras, no de la España democrática."},"truco":"Pluri = muchos: pluripartidista = muchos partidos.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1094","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"¿Dónde tiene lugar la investidura del presidente del Gobierno?","opts":{"a":"En el Palacio de la Moncloa.","b":"En el Congreso de los Diputados.","c":"En el Senado."},"ans":"b","page":24,"nueva2026":false,"enModelos":0,"hermanas":["1120","1039"],"exp":{"why":"La investidura del presidente del Gobierno se hace en el Congreso de los Diputados, a propuesta del rey. Allí también se debaten las cuestiones de confianza y las mociones de censura.","cita":{"texto":"En el Congreso de los Diputados también tiene lugar la investidura del presidente del Gobierno, a propuesta del rey, y es el sitio en el que se debaten las cuestiones de confianza o las mociones de censura al presidente.","pag":9},"distractores":{"a":"El Palacio de la Moncloa es la residencia oficial del presidente del Gobierno, no el lugar donde se le inviste.","c":"El Senado es la cámara de representación territorial; no participa en la investidura."},"truco":"Investidura, confianza y censura: todo lo del presidente pasa por el Congreso.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1095","tarea":1,"subtema":"La Corona","tipo":"multiple","q":"¿Quién tiene el mando supremo de las Fuerzas Armadas?","opts":{"a":"El rey.","b":"El presidente del Gobierno.","c":"El ministro de Defensa."},"ans":"a","page":24,"nueva2026":false,"enModelos":0,"hermanas":["1011","1015","1021","1040"],"exp":{"why":"El rey tiene el mando supremo de las Fuerzas Armadas y es su máxima autoridad. La dirección del día a día corresponde al Ministerio de Defensa.","cita":{"texto":"Además, entre otras funciones, aprobar y ordenar la publicación oficial de las leyes, nombra a los miembros del Gobierno, a propuesta de su presidente, y tiene el mando supremo de las Fuerzas Armadas de España.","pag":8},"distractores":{"b":"El presidente del Gobierno dirige la política de defensa, pero el mando supremo de las Fuerzas Armadas es del rey.","c":"El Ministerio de Defensa dirige las Fuerzas Armadas, pero su máxima autoridad y mando supremo es el rey."},"truco":"Mando supremo = el rey; dirección = Ministerio de Defensa.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1096","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"¿Quién es el representante del Estado en una comunidad autónoma?","opts":{"a":"El presidente de la comunidad autónoma.","b":"El delegado del Gobierno.","c":"El presidente de la Asamblea autonómica."},"ans":"b","page":25,"nueva2026":false,"enModelos":1,"hermanas":["1035"],"exp":{"why":"El delegado del Gobierno representa al Estado en una comunidad autónoma. Coordina la Administración del Estado en ese territorio y colabora con el gobierno autonómico.","cita":{"texto":"El representante del Estado en una comunidad autónoma es el delegado del Gobierno, que coordina y supervisa la acción de la Administración del Estado en el territorio autonómico,","pag":13},"distractores":{"a":"El presidente de la comunidad autónoma representa a la propia comunidad, no al Estado.","c":"El presidente de la Asamblea autonómica dirige el parlamento de la comunidad; no representa al Estado."},"truco":"Delegado DEL GOBIERNO = el Estado «delega» en él.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1097","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"¿Cuántas provincias hay en España?","opts":{"a":"45.","b":"50.","c":"55."},"ans":"b","page":25,"nueva2026":false,"enModelos":1,"hermanas":["1027"],"exp":{"why":"En España hay 50 provincias, a las que se suman las ciudades autónomas de Ceuta y Melilla.","cita":{"texto":"Existen 50 provincias en España, a las que hay que sumar las ciudades autónomas de Ceuta y Melilla.","pag":13},"distractores":{"a":"45 es una cifra inventada: faltan provincias.","c":"55 es una cifra inventada: sobran provincias."},"truco":"17 comunidades, 50 provincias y 2 ciudades autónomas.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1098","tarea":1,"subtema":"Lenguas e instituciones lingüísticas","tipo":"multiple","q":"La enseñanza de las lenguas cooficiales es competencia…","opts":{"a":"del Estado.","b":"de la comunidad autónoma.","c":"de la provincia."},"ans":"b","page":25,"nueva2026":false,"enModelos":1,"hermanas":["1012","1102"],"exp":{"why":"La enseñanza de las lenguas cooficiales (catalán, gallego, euskera…) es competencia de las comunidades autónomas donde se hablan.","cita":{"texto":"En España la enseñanza de las lenguas cooficiales es competencia de las comunidades autónomas.","pag":7},"distractores":{"a":"El Estado tiene competencias como nacionalidad, extranjería o relaciones internacionales, pero no la enseñanza de las lenguas cooficiales.","c":"Las provincias no tienen esta competencia: la tienen las comunidades autónomas."},"truco":"Lengua cooficial → la enseña su comunidad autónoma.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1099","tarea":1,"subtema":"Gobierno y presidentes","tipo":"multiple","q":"El poder ejecutivo corresponde…","opts":{"a":"al Gobierno del Estado.","b":"al Congreso y al Senado.","c":"a los jueces y magistrados."},"ans":"a","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1109","1064","1074","1009"],"exp":{"why":"El poder ejecutivo corresponde al Gobierno. El manual dice que el Gobierno es el órgano superior del poder ejecutivo.","cita":{"texto":"El Gobierno dirige la política interior y exterior de España, la Administración civil y militar, y la defensa del Estado. Es el órgano superior del poder ejecutivo.","pag":9},"distractores":{"b":"El Congreso y el Senado forman las Cortes Generales, que son el poder legislativo.","c":"Los jueces y magistrados forman el poder judicial."},"truco":"Ejecutivo = Gobierno; legislativo = Cortes; judicial = jueces.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1100","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"¿Cuántas cámaras hay en el Parlamento español?","opts":{"a":"Una.","b":"Dos.","c":"Tres."},"ans":"b","page":25,"nueva2026":false,"enModelos":1,"hermanas":["1073","1103","1016","1054"],"exp":{"why":"El Parlamento español (las Cortes Generales) tiene dos cámaras: el Congreso de los Diputados y el Senado.","cita":{"texto":"Las Cortes Generales (nombre oficial del Parlamento español) representan al pueblo español y están formadas por dos cámaras: el Congreso de los Diputados y el Senado.","pag":9},"distractores":{"a":"No es un parlamento de una sola cámara: además del Congreso está el Senado.","c":"No hay tercera cámara: solo Congreso y Senado."},"truco":"Dos cámaras: Congreso + Senado.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1101","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"El suministro de agua y el alumbrado de las ciudades es competencia de…","opts":{"a":"el ayuntamiento.","b":"el Gobierno autonómico.","c":"el Ministerio de Obras Públicas y Urbanismo."},"ans":"a","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1105","1020"],"exp":{"why":"El suministro de agua y la iluminación de las calles son competencia del ayuntamiento, igual que el urbanismo o las instalaciones deportivas.","cita":{"texto":"Entre las competencias de los ayuntamientos se encuentran la protección de su patrimonio histórico, medio ambiente, urbanismo, suministro de agua e iluminación, actividades e instalaciones culturales y deportivas, etc.","pag":14},"distractores":{"b":"El gobierno autonómico gestiona temas como la sanidad o la educación, no el agua ni las farolas de cada pueblo.","c":"Un ministerio pertenece a la Administración central del Estado; no gestiona los servicios de cada ciudad."},"truco":"Lo que ves en tu calle (agua, farolas, parques) lo gestiona el ayuntamiento.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1102","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"En materias como nacionalidad, inmigración, emigración o extranjería solo tiene competencia…","opts":{"a":"el Estado.","b":"las comunidades autónomas.","c":"los ayuntamientos."},"ans":"a","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1104","1012","1098"],"exp":{"why":"El Estado tiene competencias exclusivas en nacionalidad, extranjería, inmigración, relaciones internacionales y administración de justicia.","cita":{"texto":"El Estado posee competencias exclusivas sobre materias como nacionalidad, extranjería, inmigración, relaciones internacionales y administración de justicia.","pag":12},"distractores":{"b":"Las comunidades autónomas gestionan materias como la sanidad y la educación, pero no la nacionalidad ni la extranjería.","c":"Los ayuntamientos se ocupan de servicios locales (agua, urbanismo…), no de nacionalidad ni de extranjería."},"truco":"Todo lo que tiene que ver con «fuera» (extranjeros, otros países, nacionalidad) es del Estado.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1103","tarea":1,"subtema":"Gobierno y presidentes","tipo":"multiple","q":"¿Cuántas mujeres han sido presidentas de Gobierno en España?","opts":{"a":"Ninguna.","b":"Una.","c":"Dos."},"ans":"a","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1079","1100"],"exp":{"why":"Según el manual, desde 1978 ha habido 7 presidentes del Gobierno y todos han sido hombres: Suárez, Calvo-Sotelo, González, Aznar, Zapatero, Rajoy y Sánchez. Ninguna mujer ha presidido el Gobierno.","cita":{"texto":"Desde que se aprobó la Constitución española en 1978 hasta 2023, ha habido 7 presidentes de Gobierno, pertenecientes a 3 partidos, como se observa en la Tabla 3.","pag":17},"distractores":{"b":"Falso: en la lista de presidentes del manual no hay ninguna mujer. Ha habido vicepresidentas, pero no presidentas.","c":"Falso: ninguna mujer ha sido presidenta del Gobierno, ni una ni dos."},"truco":"","fuera_manual":false,"sensible_tiempo":true}},{"id":"1104","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"Las relaciones internacionales son competencia de…","opts":{"a":"el Estado.","b":"las comunidades autónomas.","c":"los ayuntamientos."},"ans":"a","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1102","1012"],"exp":{"why":"Las relaciones internacionales son una competencia exclusiva del Estado, igual que la nacionalidad, la extranjería, la inmigración y la administración de justicia.","cita":{"texto":"El Estado posee competencias exclusivas sobre materias como nacionalidad, extranjería, inmigración, relaciones internacionales y administración de justicia.","pag":12},"distractores":{"b":"Las comunidades autónomas no dirigen las relaciones con otros países; gestionan, por ejemplo, la sanidad y la educación.","c":"Los ayuntamientos gestionan servicios locales, no las relaciones internacionales."},"truco":"Otros países = Estado.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1105","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"El Ayuntamiento está formado por el alcalde y…","opts":{"a":"los concejales.","b":"los diputados.","c":"los senadores."},"ans":"a","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1107","1106","1031","1041"],"exp":{"why":"El ayuntamiento está formado por el alcalde y los concejales. Los eligen los vecinos en las elecciones municipales.","cita":{"texto":"El órgano de gobierno es el ayuntamiento, formado por el alcalde y los concejales, que se encargan de gestionar los servicios públicos de la ciudad o del pueblo","pag":14},"distractores":{"b":"Los diputados están en el Congreso (o en las diputaciones provinciales y los parlamentos autonómicos), no en el ayuntamiento.","c":"Los senadores son miembros del Senado, una de las cámaras de las Cortes Generales."},"truco":"Ayuntamiento = alcalde + concejales; Cortes = diputados + senadores.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1106","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"¿Quiénes forman el gobierno de las comunidades autónomas?","opts":{"a":"El presidente y los ministros.","b":"El alcalde y los concejales.","c":"El presidente y los consejeros."},"ans":"c","page":25,"nueva2026":false,"enModelos":1,"hermanas":["1105","1035","1041"],"exp":{"why":"El gobierno de una comunidad autónoma es el consejo de gobierno, con funciones ejecutivas. Lo forman el presidente de la comunidad y los consejeros, que dirigen cada área (las consejerías).","cita":{"texto":"el consejo de gobierno, con funciones ejecutivas; y el presidente, que además de su función ejecutiva, representa a la comunidad autónoma.","pag":13},"distractores":{"a":"Presidente y ministros forman el Gobierno de España; en las comunidades autónomas no hay ministros, sino consejeros.","b":"El alcalde y los concejales forman el ayuntamiento, es decir, el gobierno del municipio."},"truco":"Consejo de gobierno → consejeros (y sus consejerías). Ministros solo en el Gobierno de España.","fuera_manual":true,"sensible_tiempo":false}},{"id":"1107","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"¿Cuál es el órgano de gobierno en los municipios?","opts":{"a":"El ayuntamiento.","b":"La diputación.","c":"El cabildo."},"ans":"a","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1105","1108","1089"],"exp":{"why":"El órgano de gobierno de los municipios es el ayuntamiento, formado por el alcalde y los concejales.","cita":{"texto":"Existen 8132 municipios en España. El órgano de gobierno es el ayuntamiento, formado por el alcalde y los concejales,","pag":14},"distractores":{"b":"La diputación es el órgano de gobierno de la provincia, no del municipio.","c":"El cabildo es el órgano de gobierno de cada isla en Canarias, no de los municipios."},"truco":"Municipio → ayuntamiento; provincia → diputación; isla canaria → cabildo.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1108","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"¿Cómo se llaman los órganos de gobierno de las provincias españolas?","opts":{"a":"Cabildos.","b":"Consejos insulares.","c":"Diputaciones."},"ans":"c","page":25,"nueva2026":false,"enModelos":1,"hermanas":["1089","1022","1107"],"exp":{"why":"El órgano de gobierno de la provincia es la diputación. Las excepciones son Canarias (cabildos) y Baleares (consejos insulares); las comunidades de una sola provincia no tienen diputación.","cita":{"texto":"de la provincia es la Diputación, excepto en Canarias e Islas Baleares. En Canarias los órganos de gobierno son los cabildos y en Baleares son los consejos insulares.","pag":14},"distractores":{"a":"Los cabildos son solo de Canarias, no de las provincias en general.","b":"Los consejos insulares son solo de las Islas Baleares."},"truco":"Provincia → diputación (salvo en las islas: cabildos en Canarias y consejos insulares en Baleares).","fuera_manual":false,"sensible_tiempo":false}},{"id":"1109","tarea":1,"subtema":"Gobierno y presidentes","tipo":"multiple","q":"¿Cuál es el órgano superior del poder ejecutivo?","opts":{"a":"El Gobierno.","b":"Las Fuerzas Armadas.","c":"Las Cortes Generales."},"ans":"a","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1099","1021"],"exp":{"why":"El Gobierno es el órgano superior del poder ejecutivo. Dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado.","cita":{"texto":"El Gobierno dirige la política interior y exterior de España, la Administración civil y militar, y la defensa del Estado. Es el órgano superior del poder ejecutivo.","pag":9},"distractores":{"b":"Las Fuerzas Armadas defienden el país y están dirigidas por el Ministerio de Defensa; no son el poder ejecutivo.","c":"Las Cortes Generales son el poder legislativo: hacen las leyes y controlan al Gobierno."},"truco":"Ejecutivo = Gobierno; legislativo = Cortes; judicial = jueces.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1110","tarea":1,"subtema":"Lenguas e instituciones lingüísticas","tipo":"multiple","q":"El idioma español también se llama…","opts":{"a":"aragonés.","b":"castellano.","c":"leonés."},"ans":"b","page":25,"nueva2026":false,"enModelos":0,"hermanas":["1006"],"exp":{"why":"El español también se llama castellano. El manual usa las dos palabras como sinónimos: «castellano o español».","cita":{"texto":"Además del castellano o español, se hablan otras lenguas oficiales en las siguientes comunidades autónomas","pag":7},"distractores":{"a":"El aragonés es una lengua minoritaria propia de algunas zonas de Aragón, distinta del español.","c":"El leonés es una lengua minoritaria propia de algunas zonas de León, distinta del español."},"truco":"Castellano viene de Castilla: es el mismo idioma que el español.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1111","tarea":1,"subtema":"UE y organismos internacionales","tipo":"multiple","q":"¿A quiénes se elige en las elecciones al Parlamento Europeo?","opts":{"a":"A los ministros europeos.","b":"A los consejeros delegados.","c":"A los eurodiputados."},"ans":"c","page":26,"nueva2026":false,"enModelos":0,"hermanas":["1115"],"exp":{"why":"En las elecciones europeas, que se celebran cada cinco años, se elige a los eurodiputados españoles del Parlamento Europeo.","cita":{"texto":"Además, cada cinco años se celebran (como en el resto de la UE) las elecciones europeas, en las que se elige a los eurodiputados españoles en el Parlamento Europeo.","pag":16},"distractores":{"a":"Los ministros no se eligen en elecciones: los nombra cada Gobierno.","b":"Los consejeros delegados dirigen empresas; no tienen nada que ver con las elecciones europeas."},"truco":"Parlamento Europeo → euro + diputados = eurodiputados.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1112","tarea":1,"subtema":"Participación: elecciones, partidos, sindicatos","tipo":"multip va2026":false,"enModelos":0,"hermanas":["1087","1065","1057"],"exp":{"why":"El Tribunal de Cuentas controla las finanzas y el presupuesto de las administraciones, y también las cuentas de los partidos políticos.","cita":{"texto":"El Tribunal de Cuentas controla las finanzas y presupuesto de las administraciones, así como la contabilidad de los partidos políticos.","pag":12},"distractores":{"a":"El Banco de España es una institución económica importante, pero no controla las cuentas de las administraciones.","b":"La Agencia Tributaria recauda los impuestos; no controla cómo gasta el dinero el Estado."},"truco":"Tribunal de CUENTAS: revisa las cuentas del Estado.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1115","tarea":1,"subtema":"Participación: elecciones, partidos, sindicatos","tipo":"multiple","q":"¿A quiénes se elige en las elecciones generales?","opts":{"a":"A los senadores y diputados.","b":"A los eurodiputados.","c":"A los concejales."},"ans":"a","page":26,"nueva2026":false,"enModelos":0,"hermanas":["1111","1113","1031"],"exp":{"why":"En las elecciones generales se elige a los diputados del Congreso y a los senadores del Senado, es decir, a las Cortes Generales.","cita":{"texto":"En España se convocan cada cuatro años y pueden ser: generales, para elegir a los diputados y senadores del Congreso y del Senado, respectivamente;","pag":16},"distractores":{"b":"A los eurodiputados se les elige en las elecciones europeas, cada cinco años.","c":"A los concejales se les elige en las elecciones municipales."},"truco":"Generales → Cortes Generales (diputados + senadores); municipales → concejales; europeas → eurodiputados.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1116","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"¿Cuántos miembros tiene el Congreso de los Diputados?","opts":{"a":"300.","b":"350.","c":"400."},"ans":"b","page":26,"nueva2026":false,"enModelos":0,"hermanas":[],"exp":{"why":"El Congreso de los Diputados tiene 350 diputados, que se eligen por provincias.","cita":{"texto":"El Congreso de los Diputados está compuesto por 350 diputados, que se eligen por provincias.","pag":9},"distractores":{"a":"300 es una cifra inventada; son 350.","c":"400 es una cifra inventada; son 350."},"truco":"350 diputados en el Congreso; en el Senado, según el manual, 265 senadores.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1117","tarea":1,"subtema":"Organización territorial y competencias","tipo":"multiple","q":"Los municipios y provincias forman parte de la Administración…","opts":{"a":"autonómica.","b":"local.","c":"central."},"ans":"b","page":26,"nueva2026":false,"enModelos":1,"hermanas":["1092","1051"],"exp":{"why":"La Administración tiene tres niveles: central (el Estado), autonómica (las comunidades autónomas) y local, que incluye las provincias y los municipios.","cita":{"texto":"Se distinguen tres niveles de organización de la Administración: central (del Estado), autonómica (de las comunidades autónomas) y local (en este nivel se incluyen las provincias y los municipios).","pag":12},"distractores":{"a":"La Administración autonómica es la de las comunidades autónomas.","c":"La Administración central es la del Estado."},"truco":"Central = Estado; autonómica = comunidades; local = provincias y municipios.","fuera_manual":false,"sensible_tiempo":false}},{"id":"1118","tarea":1,"subtema":"Población","tipo":"multiple","q":"La comunidad autónoma más poblada de España es…","opts":{"a":"Andalucía.","b":"Cataluña.","c":"Castilla y León."},"ans":"a","page":26,"nueva2026":false,"enModelos":0,"hermanas":["1062","1067"],"exp":{"why":"Según la tabla del manual, Andalucía es la comunidad más poblada, con unos 8,6 millones de habitantes. Le siguen Cataluña (8 millones) y Madrid (7 millones).","cita":{"texto":"Andalucía 8 631 862 Castilla La Mancha 2 104 433 Murcia 1 568 492 Aragón 1 351 591 Cataluña 8 012 231","pag":16},"distractores":{"b":"Cataluña es la segunda comunidad más poblada, con unos 8 millones, por detrás de Andalucía.","c":"Castilla y León es la comunidad más extensa, pero tiene unos 2,4 millones de habitantes."},"truco":"Podio de población: Andalucía, Cataluña y Madrid.","fuera_manual":false,"sensible_tiempo":true}},{"id":"1119","tarea":1,"subtema":"Participación: elecciones, partidos, sindicatos","tipo":"multiple","q":"¿Cómo se llama la organización que defiende los intereses de los trabajadores?","opts":{"a":"Asociación.","b":"Partido.","c":"Sindicato."},"ans":"c","page":26,"nueva2026":false,"enModelos":2,"hermanas":["2025","5083"],"exp":{"why":"Los sindicatos son organizaciones que defienden y promueven los intereses de los trabajadores. La Constitución los menciona en los artículos 7 y 28.","cita":{"texto":"los sindicatos —organizaciones que defienden y promueven los intereses de los trabajadores— (artículos 7 y 28)","pag":17},"distractores":{"a":"Una asociación es un grupo de personas con un fin común; es una palabra general, no la organización propia de los trabajadores.","b":"Un partido político se presenta a las elecciones para gobernar; no defiende específicamente a los trabajadores en su empresa."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"1120","tarea":1,"subtema":"Cortes Generales y leyes","tipo":"multiple","q":"¿Quién elige al presidente del Gobierno?","opts":{"a":"El Congreso de los Diputados.","b":"El rey.","c":"El Tribunal Supremo."},"ans":"a","page":26,"nueva2026":true,"enModelos":1,"hermanas":["1094","1064","1073"],"exp":{"why":"El presidente del Gobierno lo elige el Congreso de los Diputados en la investidura. El rey propone al candidato, pero quien vota y decide es el Congreso.","cita":{"texto":"En el Congreso de los Diputados también tiene lugar la investidura del presidente del Gobierno, a propuesta del rey, y es el sitio en el que se debaten las cuestiones de confianza o las mociones de censura al presidente.","pag":9},"distractores":{"b":"El rey solo propone al candidato; no lo elige.","c":" star privado del voto por sentencia judicial."},"truco":"Para votar solo cuentan dos cosas: ser español y tener 18 años. La forma de conseguir la nacionalidad no importa.","fuera_manual":false,"sensible_tiempo":false}},{"id":"2003","tarea":2,"subtema":"Integridad, intimidad y datos","tipo":"vf","q":"En España, la Constitución prohíbe la tortura y la pena de muerte.","opts":{"a":"Verdadero.","b":"Falso."},"ans":"a","page":33,"nueva2026":true,"enModelos":0,"hermanas":[],"exp":{"why":"Es verdadero. El artículo 15 reconoce a todos el derecho a la vida y a la integridad física y moral. Por eso se elimina la pena de muerte y se prohíbe la tortura.","cita":{"texto":"Todos tienen derecho a la vida y a la integridad física y moral. Se elimina la pena de muerte y se prohíbe la tortura.","pag":29},"distractores":{"b":"No es falso: el artículo 15 prohíbe expresamente tanto la tortura como la pena de muerte."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"2004","tarea":2,"subtema":"Asociación, partidos, sindicatos y huelga","tipo":"vf","q":"El funcionamiento de los partidos políticos tiene que ser democrático.","opts":{"a":"Verdadero.","b":"Falso."},"ans":"a","page":33,"nueva2026":true,"enModelos":0,"hermanas":["2011","1093"],"exp":{"why":"Es verdadero. El artículo 6 dice que la creación de partidos políticos es libre, pero su estructura y su funcionamiento deben ser democráticos.","cita":{"texto":"Su estructura y funcionamiento deberán ser democráticos.","pag":28},"distractores":{"b":"No es falso: el artículo 6 exige que los partidos funcionen de forma democrática, aunque crearlos sea libre."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"2005","tarea":2,"subtema":"Libertad ideológica y religiosa","tipo":"vf","q":"Se puede obligar a alguien a decir cuáles son sus ideas políticas o religiosas.","opts":{"a":"Verdadero.","b":"Falso."},"ans":"b","page":33,"nueva2026":false,"enModelos":0,"hermanas":["2001","2027"],"exp":{"why":"Es falso. El artí os más importantes que cita el manual."},"truco":"Adolfo Suárez fue presidente del Gobierno → su aeropuerto está en la capital, Madrid (Barajas).","fuera_manual":false,"sensible_tiempo":false}},{"id":"5068","tarea":5,"subtema":"Tráfico y vehículos","tipo":"multiple","q":"En un coche es obligatorio el uso del cinturón de seguridad...","opts":{"a":"solo en el asiento del conductor.","b":"en los asientos delanteros.","c":"en todos los asientos."},"ans":"c","page":97,"nueva2026":false,"enModelos":0,"hermanas":["5069"],"exp":{"why":"El cinturón de seguridad es obligatorio para todos los ocupantes del coche, delante y detrás. Para los bebés hay además normas sobre la silla portabebés.","cita":{"texto":"Uso de medidas de seguridad en el coche como el uso obligatorio del cinturón de seguridad de todos los ocupantes y la normativa sobre el uso de la silla portabebés","pag":87},"distractores":{"a":"No solo el conductor: todos los ocupantes deben llevarlo.","b":"No solo delante: los pasajeros de atrás también deben ponerse el cinturón."},"truco":"Todos dentro, todos con cinturón.","fuera_manual":false,"sensible_tiempo":false}},{"id":"5069","tarea":5,"subtema":"Tráfico y vehículos","tipo":"multiple","q":"¿Cuál es el límite de velocidad en autopista?","opts":{"a":"90 km/h.","b":"120 km/h.","c":"150 km/h."},"ans":"b","page":97,"nueva2026":false,"enModelos":0,"hermanas":["5010","5068"],"exp":{"why":"En autopista y autovía el límite es de 120 km/h. En carretera convencional es de 90 km/h y en ciudad de 20, 30 o 50 km/h.","cita":{"texto":"el límite en autopista o autovía es de 120 km/h, en carretera convencional es de 90 km/h y dentro de la ciudad es de 20, 30 o 50 km/h","pag":87},"distractores":{"a":"90 km/h es el límite en carretera convencional, no en autopista.","c":"150 km/h supera el límite: en España no se puede ir tan rápido en ninguna vía."},"truco":"Autopista 120, carretera 90, ciudad 50 o menos.","fuera_manual":false,"sensible_tiempo":false}},{"id":"5070","tarea":5,"subte ":90},"distractores":{"b":"18 años es la edad para votar y para sacar el carné de conducir, no la mínima para trabajar.","c":"21 años no es ningún límite legal para trabajar en España."},"truco":"16 para trabajar; 18 para conducir y votar.","fuera_manual":false,"sensible_tiempo":false}},{"id":"5075","tarea":5,"subtema":"Economía, trabajo e impuestos","tipo":"multiple","q":"¿Cuál es el sector de mayor peso en la economía española?","opts":{"a":"Agricultura.","b":"Servicios.","c":"Construcción."},"ans":"b","page":97,"nueva2026":false,"enModelos":1,"hermanas":["5084"],"exp":{"why":"El sector servicios (sector terciario) es el de mayor peso en la economía española. Después va el secundario (industria y construcción) y por último el primario (agricultura, pesca y ganadería).","cita":{"texto":"En primer lugar, se encuentra el sector terciario (servicios), en segundo lugar, se sitúa el sector secundario (industria y construcción) y, en tercer lugar, el primario (agricultura, pesca y ganadería).","pag":89},"distractores":{"a":"La agricultura forma parte del sector primario, el de menor peso en la economía española.","c":"La construcción forma parte del sector secundario, junto con la industria: está en segundo lugar."},"truco":"Orden al revés de los nombres: 1.º terciario (servicios), 2.º secundario, 3.º primario.","fuera_manual":false,"sensible_tiempo":false}},{"id":"5076","tarea":5,"subtema":"Economía, trabajo e impuestos","tipo":"multiple","q":"España es innovadora en el sector de…","opts":{"a":"la ingeniería aeroespacial.","b":"las energías renovables.","c":"la energía nuclear."},"ans":"b","page":97,"nueva2026":false,"enModelos":0,"hermanas":["5084"],"exp":{"why":"España es innovadora en energías renovables, y también en biotecnología, en el sector farmacéutico y en transportes.","cita":{"texto":"España cuenta con una importante posición en innovación, con desarrollos importantes en energías renovables, en biotecnología, en el sector farmacéutico","pag":90},"distractore e los trabajadores (sindicatos) sobre las condiciones laborales.","cita":{"texto":"Los convenios colectivos son acuerdos que se firman entre la empresa y los representantes de los trabajadores (sindicatos) sobre las condiciones laborales.","pag":91},"distractores":{"b":"El futuro de la empresa lo deciden sus dueños y directivos; no es el tema de un convenio colectivo.","c":"La relación con los clientes no se negocia en un convenio con los trabajadores."},"truco":"","fuera_manual":false,"sensible_tiempo":false}},{"id":"5084","tarea":5,"subtema":"Economía, trabajo e impuestos","tipo":"multiple","q":"¿En cuál de estos sectores destaca España?","opts":{"a":"En el turismo.","b":"En la industria automovilística.","c":"En tecnología digital."},"ans":"a","page":98,"nueva2026":true,"enModelos":0,"hermanas":["5075","5076"],"exp":{"why":"España destaca en el turismo. Según el manual, es el tercer país del mundo en número de turistas extranjeros (informe de la OMT de 2017) y en 2023 la visitaron 93,8 millones de turistas internacionales.","cita":{"texto":"Según el informe de 2017 de la Organización Mundial de Turismo (OMT), España es el tercer país del mundo en número de turistas extranjeros.","pag":90},"distractores":{"b":"España fabrica y exporta automóviles, pero el sector en el que destaca según el manual es el turismo.","c":"La tecnología digital no es el sector estrella que señala el manual; lo es el turismo."},"truco":"","fuera_manual":false,"sensible_tiempo":true}}],"fichas":[{"id":"t1-constitucion","tarea":1,"subtema":"Constitución, valores y forma de Estado","titulo":"La Constitución y el Estado español","puntos":["La Constitución se aprobó en referéndum el 6 de diciembre de 1978 (primer referéndum de la democracia).","Es la «ley de leyes» o ley fundamental de España: todo el sistema jurídico se basa en ella.","España es un Estado social y democrático de Derecho.","Su forma política es la monarquía parlamentaria.","Valores superiores: la libertad, la justicia, la igua
